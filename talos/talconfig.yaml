---
clusterName: ${CLUSTE_NAME}
endpoint: ${ENDPOINT}
talosVersion: ${TALOS_VERSION}
kubernetesVersion: ${KUBERNETES_VERSION}
allowSchedulingOnMasters: true
allowSchedulingOnControlPlanes: true
domain: cluster.local
clusterPodNets:
  - 10.244.0.0/16
  - fd00:10:244::/48
clusterSvcNets:
  - 10.96.0.0/12
  - fd00:10:96::/112
nodes:
  - hostname: node1
    controlPlane: true
    ipAddress: ${NODE1_IP}
    installDisk: /dev/mmcblk0
    nodeLabels: &rk1-labels
      topology.kubernetes.io/zone: tpi1
      topology.kubernetes.io/region: home
    schematic: &rk1-schema
      overlay:
        image: siderolabs/sbc-rockchip
        name: turingrk1
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
    volumes: &rk1-volume
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/nvme0n1"
          minSize: 50GB
          maxSize: 100GB
          grow: false
    userVolumes: &rk1-userVolume
      - name: longhorn-data
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/nvme0n1"
          minSize: 800GB
          maxSize: 900GB
          grow: true
  - hostname: node2
    controlPlane: false
    ipAddress: ${NODE2_IP}
    installDisk: /dev/mmcblk0
    nodeLabels: *rk1-labels
    schematic: *rk1-schema
    volumes: *rk1-volume
    userVolumes: *rk1-userVolume
  - hostname: node3
    controlPlane: false
    ipAddress: ${NODE3_IP}
    installDisk: /dev/mmcblk0
    nodeLabels: *rk1-labels
    schematic: *rk1-schema
    volumes: *rk1-volume
    userVolumes: *rk1-userVolume
  - hostname: node4
    controlPlane: true
    ipAddress: ${NODE4_IP}
    installDisk: /dev/mmcblk0
    nodeLabels: *rk1-labels
    schematic: *rk1-schema
    volumes: *rk1-volume
    userVolumes: *rk1-userVolume
  - hostname: nas
    controlPlane: true
    ipAddress: ${NAS_IP}
    installDisk: /dev/mmcblk0
    nodeLabels:
      topology.kubernetes.io/zone: me1
      topology.kubernetes.io/region: home
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/i915
            - siderolabs/iscsi-tools
            - siderolabs/mdadm
            - siderolabs/nfsd
            - siderolabs/util-linux-tools
    volumes:
      - name: EPHEMERAL
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/nvme3n1"
          minSize: 50GB
          maxSize: 100GB
          grow: false
    userVolumes:
      - name: longhorn-data
        provisioning:
          diskSelector:
            match: disk.dev_path == "/dev/nvme3n1"
          minSize: 800GB
          maxSize: 900GB
          grow: true
    patches:
      - |-
        machine:
          disks:
            - device: /dev/disk/by-id/md-uuid-426d33f1:f8991054:bace6eef:4b7f2ea3
              partitions:
                - mountpoint: /var/mnt/raid-storage
      # - name: raid-storage
      #   provisioning:
      #     diskSelector:
      #       match: disk.dev_path == "/dev/md0"
      #   filesystem:
      #     type: xfs

    # patches:
    #   - |-
    #     machine:
    #       files:
    #         - path: /usr/local/bin/init-raid.sh
    #           permissions: 0755
    #           content: |
    #             #!/bin/sh
    #             # Check if the array already exists
    #             if [ -b /dev/md0 ]; then
    #               echo "RAID array /dev/md0 already exists. Skipping creation."
    #               exit 0
    #             end
    #
    #             # Check for existing superblocks on any of the target disks
    #             # This prevents accidental data loss on reboot
    #             for disk in /dev/nvme0n1 /dev/nvme1n1 /dev/nvme2n1; do
    #               if mdadm --examine $$disk > /dev/null 2>&1; then
    #                 echo "Existing RAID metadata found on $disk. Attempting assembly..."
    #                 mdadm --assemble --scan
    #                 exit 0
    #               fi
    #             done
    #
    #             # Create the RAID 5 array
    #             echo "Creating new RAID 5 array on /dev/nvme0n1, /dev/nvme1n1, /dev/nvme2n1..."
