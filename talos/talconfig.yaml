      machine:
        network:
          interfaces:
            - interface: end0
              dhcp: true
              vip:
                ip: ${CLUSTER_VIP}
              vlans:
                - vlanId: 2
                  dhcp: true
                  dhcpOptions:
                    routeMetric: 4096
            - interface: enp2s0
              dhcp: true
              vip:
                ip: ${CLUSTER_VIP}
              vlans:
                - vlanId: 2
                  dhcp: true
                  dhcpOptions:
                    routeMetric: 4096
    - |-
      cluster:
        etcd:
          advertisedSubnets:
            - ${LAN_SUBNET}
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
