[tools]
cilium-cli = "0.20.1"
"github:postfinance/topf" = "0.6.1"
"github:turing-machines/tpi" = "1.0.7"
talosctl = "1.14.2"

[env]
TALOSCONFIG = "{{config_root}}/clusterconfig/talosconfig"

[hooks.enter]
shell = "fish"
script = '''
talosctl completion fish | source
topf completion fish | source
'''
