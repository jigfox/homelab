apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: evcc
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infra-cilium
    - name: infra-longhorn
  interval: 1h
  prune: true
  path: ./apps/evcc
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
        namespace: flux-system
