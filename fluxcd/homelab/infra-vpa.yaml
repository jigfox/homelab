apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-vpa
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-sources
  interval: 1h
  prune: true
  # Goldilocks needs the VPA CRDs, so wait for the HelmRelease
  wait: true
  path: ./infrastructure/base/vpa
  sourceRef:
    kind: GitRepository
    name: flux-system
