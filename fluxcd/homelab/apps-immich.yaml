apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infra-sources
    - name: infra-longhorn
    - name: infra-cnpg
    - name: infra-nas-storage
    - name: infra-intel-igpu
  interval: 1h
  prune: true
  path: ./apps/immich
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
