apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-homelab-dns
  namespace: flux-system
spec:
  interval: 1h
  prune: true
  path: ./infrastructure/base/homelab-dns
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
