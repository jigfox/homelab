apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-technitium-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    # namespace dns (the Role for technitium-secrets lives there)
    - name: technitium
  interval: 1h
  prune: true
  path: ./infrastructure/base/technitium-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
  # ready only once the operator's Deployment (and with it the CRDs) is up
  healthChecks:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: technitium-operator
      namespace: flux-system
  timeout: 10m
