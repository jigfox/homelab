apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cert-manager
    - name: infra-kyverno
  interval: 1h
  prune: true
  path: ./infrastructure/configs/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
