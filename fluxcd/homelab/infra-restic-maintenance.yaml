apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-restic-maintenance
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 1h
  prune: true
  path: ./infrastructure/base/restic-maintenance
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
