apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: error-pages
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 1h
  prune: true
  path: ./apps/error-pages
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
