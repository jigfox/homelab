apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-kyverno-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-kyverno
  interval: 1h
  prune: true
  path: ./infrastructure/configs/kyverno
  sourceRef:
    kind: GitRepository
    name: flux-system
