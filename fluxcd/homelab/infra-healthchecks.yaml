apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-healthchecks
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-tofu-controller
    # namespace monitoring
    - name: infra-monitoring
  interval: 1h
  prune: true
  path: ./infrastructure/configs/healthchecks
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
