apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-unifi
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-tofu-controller
  interval: 1h
  prune: true
  path: ./infrastructure/configs/unifi
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
