apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-external-dns-internal
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infra-sources
    - name: infra-external-dns
  interval: 1h
  prune: true
  path: ./infrastructure/base/external-dns-internal
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
