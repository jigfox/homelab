apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-cilium
  interval: 1h
  prune: true
  path: ./infrastructure/base/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
