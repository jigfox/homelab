apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-lldap-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: sso
  interval: 1h
  prune: true
  path: ./infrastructure/base/lldap-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # ready only once the operator's Deployment (and with it the CRDs) is up
  healthChecks:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: lldap-operator
      namespace: flux-system
  timeout: 10m
