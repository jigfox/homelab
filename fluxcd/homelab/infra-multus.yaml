apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-multus
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/multus # Path to your environment-specific code
  prune: false # Deletes resources in K8s if they are deleted from Git
  wait: true # Flux will wait for all resources to be healthy before finishing

