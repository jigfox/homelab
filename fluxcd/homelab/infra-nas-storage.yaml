apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-nas-storage
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infra-sources
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/nas-storage
  prune: true
  # no wait: the NFS server stays unready until the md array is mounted
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
