apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-etcd-backup
  namespace: flux-system
spec:
  # the talos.dev ServiceAccount CRD exists only once the control planes run
  # talos/control-plane/04-talos-api-access.yaml
  dependsOn:
    - name: infrastructure
  interval: 1h
  prune: true
  path: ./infrastructure/base/etcd-backup
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
