# The LLDAPUsers live in the private repo homelab-users (read-only deploy key,
# infra-homelab-users).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: users
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-lldap-groups
    - name: infra-homelab-users
  interval: 1h
  prune: true
  path: ./
  sourceRef:
    kind: GitRepository
    name: homelab-users
