apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infra-sources
    - name: infra-longhorn
  interval: 1h
  prune: true
  # infra-monitoring-config needs the VM CRDs, so only report ready once the
  # HelmReleases are
  wait: true
  timeout: 15m
  path: ./infrastructure/base/monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
