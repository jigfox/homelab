apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-gateway
  namespace: flux-system
spec:
  # It only needs the source repo, no other dependencies
  dependsOn:
    - name: infra-gateway-api
  interval: 24h # CRDs rarely change, so check less often
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/gateway
  decryption:
    provider: sops
    secretRef:
      name: sops-age
