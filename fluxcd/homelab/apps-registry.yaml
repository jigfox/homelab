apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: infra-cilium
    - name: infra-longhorn
  interval: 1h
  prune: true
  path: ./apps/registry
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
