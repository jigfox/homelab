apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-longhorn-config
  namespace: flux-system
spec:
  # the RecurringJob CRD comes with the Longhorn chart
  dependsOn:
    - name: infra-longhorn
  interval: 1h
  prune: true
  path: ./infrastructure/configs/longhorn
  sourceRef:
    kind: GitRepository
    name: flux-system
