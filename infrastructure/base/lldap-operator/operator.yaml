# The operator's own config/default. The tag above and the image pin below
# move together (Renovate group "lldap-operator").
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lldap-operator
  namespace: flux-system
spec:
  interval: 1h
  prune: true
  wait: true
  timeout: 5m
  path: ./config/default
  targetNamespace: lldap-operator
  sourceRef:
    kind: GitRepository
    name: lldap-operator
  images:
    - name: controller
      newName: ghcr.io/jigfox/lldap-operator
      newTag: v0.2.0
      digest: sha256:e4aa5757efd032203efd9916201abc976e7e189d98fc32fef4f2b145c62c253b
  patches:
    # the namespace is ours (namespace.yaml)
    - target:
        kind: Namespace
      patch: |
        $patch: delete
        apiVersion: v1
        kind: Namespace
        metadata:
          name: lldap-operator-system
    # new users get Authelia's reset-password mail once (never adopted ones);
    # the URL also sets the link in the mail
    # (Flux merges these patches into config/default, before its namePrefix,
    # so match by kind: it has a single Deployment)
    - target:
        kind: Deployment
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --invite=authelia
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --authelia-url=https://sso.${GATEWAY_DOMAIN}
