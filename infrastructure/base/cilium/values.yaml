upgradeCompatibility: "1.19"
ipv6:
  enabled: true
ipam:
  mode: kubernetes
operator:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 15m
      memory: 184Mi
    limits:
      memory: 512Mi
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
hubble:
  relay:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 24Mi
      limits:
        memory: 64Mi
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
envoy:
  enabled: true
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_BIND_SERVICE
        - NET_ADMIN
        - SYS_ADMIN
  resources:
    requests:
      cpu: 10m
      memory: 80Mi
    limits:
      memory: 128Mi
bpf:
  hostLegacyRouting: true
bgpControlPlane:
  enabled: true
l2announcements:
  enbled: false
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: true
  hostRoot: /sys/fs/cgroup
k8s:
  requireIPv4PodCIDR: true
k8sServiceHost: localhost
k8sServicePort: 7445
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
  service:
    externalTrafficPolicy: "Cluster"
cni:
  # required for multus to work
  exclusive: false
resources:
  requests:
    cpu: 325m
    memory: 848Mi
  limits:
    memory: 2Gi
