apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    certmanager.io/issuer: letsencrypt
  labels:
    public: "true"
  name: cilium
  namespace: gateway-default
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: "*.${GATEWAY_DOMAIN}"
    labels:
      advertise: bgp
      public: "false"
  listeners:
    # only the https-redirect route in this namespace
    - allowedRoutes:
        namespaces:
          from: Same
      hostname: "*.${GATEWAY_DOMAIN}"
      name: http
      port: 80
      protocol: HTTP
    # only namespaces labelled homelab/gateway-routes: "true", so no other
    # namespace can claim a hostname such as sso
    - allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              homelab/gateway-routes: "true"
      hostname: "*.${GATEWAY_DOMAIN}"
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: wildcard-tls
        mode: Terminate
