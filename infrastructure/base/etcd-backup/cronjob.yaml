# Daily etcd snapshot into the shared restic repository, as host "etcd".
# talosctl asks the apid of the control plane the pod runs on; the snapshot
# holds every Secret in plain text, restic encrypts it before upload.
# Restore: restic restore latest --host etcd, then
# talosctl bootstrap --recover-from=./etcd.snapshot (see the Talos docs on
# disaster recovery).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: etcd-backup
spec:
  # between the restic sidecars' backups (minutes 0-56) and away from the
  # descheduler (03:00) and the restic checks (04:30)
  schedule: "20 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot
              image: ghcr.io/siderolabs/talosctl:v1.14.5@sha256:0b852e35c1f513ee5eacc22183d6193486012420569fde39fcd5260c51938443
              args: ["-n", "$(NODE_IP)", "etcd", "snapshot", "/backup/etcd.snapshot"]
              env:
                - name: NODE_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
          containers:
            - name: restic
              image: ghcr.io/jigfox/restic-sidecar:latest@sha256:2265118ab46e7b4ad36f8129a45cd01f171a438eb245a892d52f8d04cc1829e0
              command: ["sh", "-ec"]
              args:
                - |
                  cd /backup
                  restic backup --host etcd --retry-lock 10m etcd.snapshot
                  restic forget --host etcd --retry-lock 10m --keep-daily 14 --keep-weekly 8 --keep-monthly 6
              env:
                - name: RESTIC_REPOSITORY
                  value: s3:https://s3.eu-central-2.wasabisys.com/backup.${GATEWAY_DOMAIN}/restic
                - name: RESTIC_CACHE_DIR
                  value: /backup/cache
                # the root filesystem is read-only; restic stages packs here
                - name: TMPDIR
                  value: /backup
              envFrom:
                - secretRef:
                    name: restic
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
            - name: talos-secrets
              secret:
                secretName: talos-api-access
