# Talos turns this into the Secret talos-api-access (a talosconfig limited to
# os:etcd:backup); allowed only because control-plane/04-talos-api-access.yaml
# lists this namespace and role
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-api-access
  namespace: etcd-backup
spec:
  roles:
    - os:etcd:backup
