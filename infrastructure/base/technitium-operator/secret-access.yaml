# The operator reads only the credentials Secret of the TechnitiumServers, in
# namespace dns (the ClusterRole's cluster-wide `get` on Secrets is patched out
# in operator.yaml). Kustomization infra-technitium-operator applies this
# after the namespace exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: technitium-operator-secrets
  namespace: dns
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [technitium-secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: technitium-operator-secrets
  namespace: dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: technitium-operator-secrets
subjects:
  - kind: ServiceAccount
    name: technitium-operator-controller-manager
    namespace: technitium-operator
