apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: vpa
spec:
  releaseName: vpa
  targetNamespace: vpa
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: vpa
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  values:
    # recommendations only for Goldilocks: with the updater and the admission
    # controller off, nothing ever evicts or mutates a pod
    recommender:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 768Mi
    updater:
      enabled: false
    admissionController:
      enabled: false
