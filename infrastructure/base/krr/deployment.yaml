# KRR (github.com/robusta-dev/krr) recomputes resource recommendations from
# VMSingle once a day and renders them as an HTML report that nginx serves.
# The report is written to a temp file and renamed so nginx never serves a
# half-written one. The image has no coreutils, hence python for the loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krr
  namespace: krr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: krr
  template:
    metadata:
      labels:
        app: krr
    spec:
      serviceAccountName: krr
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: krr
          image: us-central1-docker.pkg.dev/genuine-flight-317411/devel/krr:v1.31.1
          command:
            - python
            - -c
            - |
              import os, subprocess, time
              tmp = "/report/.index.html.tmp"
              while True:
                  r = subprocess.run([
                      "python", "krr.py", "simple", "--quiet",
                      "--prometheus-url", "http://vmsingle-vm.monitoring.svc:8428",
                      "--formatter", "html", "--fileoutput", tmp,
                  ])
                  ok = r.returncode == 0 and os.path.exists(tmp)
                  if ok:
                      os.replace(tmp, "/report/index.html")
                  time.sleep(24 * 3600 if ok else 3600)
          env:
            - name: HOME
              value: /tmp
            # rich renders the html table at the terminal width, 80 without a tty
            - name: COLUMNS
              value: "300"
          volumeMounts:
            - name: report
              mountPath: /report
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: report
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: report
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: krr
  namespace: krr
spec:
  selector:
    app: krr
  ports:
    - name: http
      port: 80
      targetPort: http
