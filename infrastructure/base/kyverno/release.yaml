apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  releaseName: kyverno
  targetNamespace: kyverno
  interval: 1h
  install:
    crds: CreateReplace # Critical for CNI migrations
  upgrade:
    force: true # Overwrites existing labels/annotations
    crds: CreateReplace
  chart:
    spec:
      chart: kyverno
      version: 3.9.2
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  values:
    admissionController:
      container:
        resources:
          requests:
            cpu: 50m
            memory: 112Mi
          limits:
            memory: 384Mi
