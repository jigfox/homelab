apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  releaseName: goldilocks
  targetNamespace: goldilocks
  interval: 1h
  chart:
    spec:
      chart: goldilocks
      version: 11.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  values:
    # the VPA recommender comes from the separate vpa release
    vpa:
      enabled: false
    controller:
      flags:
        on-by-default: true
        exclude-namespaces: kube-system,longhorn-system
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 256Mi
    dashboard:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
