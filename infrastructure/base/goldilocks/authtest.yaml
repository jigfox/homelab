# temporary: proves the ExternalAuth filter is enforced before goldilocks
# relies on it. The Service has no endpoints, so a 503 means the filter was
# skipped and a redirect to sso means it works.
apiVersion: v1
kind: Service
metadata:
  name: authtest
  namespace: goldilocks
spec:
  selector:
    app: authtest-nothing
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authtest
  namespace: goldilocks
spec:
  hostnames:
    - authtest.${GATEWAY_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      namespace: gateway-default
      sectionName: https
  rules:
    - backendRefs:
        - name: authtest
          port: 80
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: sso
              port: 80
            http:
              # envoy appends the request path to this prefix
              path: /api/authz/ext-authz/
              allowedHeaders:
                - cookie
                - x-forwarded-proto
