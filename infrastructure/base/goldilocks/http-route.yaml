apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: goldilocks
spec:
  hostnames:
    - goldilocks.${GATEWAY_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      namespace: gateway-default
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: goldilocks-dashboard
          port: 80
          weight: 1
      # authelia decides per request (access_control: group cluster-admin);
      # unauthenticated requests get its redirect to the sso portal
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: sso
              port: 80
            http:
              # envoy appends the request path to this prefix
              path: /api/authz/ext-authz/
              # accept decides between authelia's 302 (browser) and 401
              allowedHeaders:
                - accept
                - authorization
                - cookie
                - proxy-authorization
                - x-forwarded-proto
      matches:
        - path:
            type: PathPrefix
            value: /
