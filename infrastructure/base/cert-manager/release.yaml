apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  releaseName: cert-manager
  targetNamespace: kube-system
  interval: 1h
  install:
    crds: CreateReplace # Critical for CNI migrations
  upgrade:
    force: true # Overwrites existing labels/annotations
    crds: CreateReplace
  chart:
    spec:
      chart: cert-manager
      version: 1.18.2
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  values:
    global:
      leaderElection:
        namespace: cert-manager
    crds:
      enabled: true
    prometheus:
      enabled: true
      labels:
        release: kube-prometheus-stack
    extraArgs:
      - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
      - --dns01-recursive-nameservers-only
      - --enable-gateway-api
