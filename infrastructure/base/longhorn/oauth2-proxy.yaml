apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: longhorn-system
spec:
  releaseName: oauth2-proxy
  targetNamespace: longhorn-system
  interval: 1h
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.1
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
        namespace: flux-system
  # config.clientSecret and config.cookieSecret live in a sops Secret
  valuesFrom:
    - kind: Secret
      name: oauth2-proxy-values
      valuesKey: values.yaml
  values:
    config:
      clientID: longhorn
      upstreams:
        - http://longhorn-frontend.longhorn-system.svc
    extraArgs:
      provider: oidc
      oidc-issuer-url: https://sso.${GATEWAY_DOMAIN}
      redirect-url: https://longhorn.${GATEWAY_DOMAIN}/oauth2/callback
      code-challenge-method: S256
      scope: openid email profile groups
      skip-provider-button: "true"
      reverse-proxy: "true"
    podDisruptionBudget:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
