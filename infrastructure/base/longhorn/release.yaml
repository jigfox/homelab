apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  targetNamespace: longhorn-system
  interval: 1h
  install:
    crds: CreateReplace # Critical for CNI migrations
  upgrade:
    force: true # Overwrites existing labels/annotations
    crds: CreateReplace
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClassReplicaCount: 3
      defaultDataLocality: disabled
    csi:
      attacherReplicaCount: "1"
      provisionerReplicaCount: "1"
      resizerReplicaCount: "1"
      snapshotterReplicaCount: "1"
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn-data
      storageReservedPercentageForDefaultDisk: "0"
      defaultReplicaCount: '{"v1":"3","v2":"3"}'
      defaultDataLocality: disabled
      replicaAutoBalance: best-effort
      nodeDrainPolicy: block-for-eviction-if-contains-last-replica
      replicaReplenishmentWaitInterval: "3600"
    ingress:
      enabled: false
    longhornUI:
      replicas: 1
    longhornManager:
      resources:
        requests:
          cpu: 45m
          memory: 248Mi
        limits:
          memory: 512Mi
    longhornGlobalManager:
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          memory: 64Mi
