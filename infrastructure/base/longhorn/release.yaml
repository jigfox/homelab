apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  targetNamespace: longhorn-system
  interval: 1h
  install:
    crds: CreateReplace # Critical for CNI migrations
  upgrade:
    force: true # Overwrites existing labels/annotations
    crds: CreateReplace
  chart:
    spec:
      chart: longhorn
      version: v1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultDataLocality: best-effort
      defaultReplicaCount: 2
    csi:
      attacherReplicaCount: "1"
      provisionerReplicaCount: "1"
      resizerReplicaCount: "1"
      snapshotterReplicaCount: "1"
    defaultSettings:
      defaultDataPath: /var/mnt/longhorn-data
      storageReservedPercentageForDefaultDisk: "0"
      defaultReplicaCount: '{ v1: "2", v2: "2" }'
    ingress:
      enabled: false
    longhorn-ui:
    replicas: 1
