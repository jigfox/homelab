# barman-cloud CNPG-I plugin: WAL archiving and base backups to S3 through the
# ObjectStore CR. Its gRPC server and the operator authenticate each other with
# certificates from a cert-manager Issuer the chart creates (hence
# dependsOn infra-cert-manager on the Flux Kustomization).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  releaseName: plugin-barman-cloud
  targetNamespace: cnpg-system
  interval: 1h
  dependsOn:
    - name: cloudnative-pg
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  values:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
