apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
  namespace: intel-igpu
spec:
  releaseName: intel-device-plugins-operator
  targetNamespace: intel-igpu
  interval: 1h
  dependsOn:
    - name: nfd
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  values:
    # webhook certificate: the chart renders a cert-manager Issuer + Certificate
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
        cpu: null # unset the chart default CPU limit
