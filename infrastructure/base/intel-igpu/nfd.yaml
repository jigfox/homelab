apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfd
  namespace: intel-igpu
spec:
  releaseName: nfd
  targetNamespace: intel-igpu
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.20.0
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
        namespace: flux-system
  values:
    # the worker labels every node; the topology updater stays off (default)
    master:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    worker:
      resources:
        requests:
          cpu: 10m
          memory: 56Mi
        limits:
          memory: 128Mi
    gc:
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          memory: 64Mi
