apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
  namespace: intel-igpu
spec:
  releaseName: intel-device-plugins-gpu
  targetNamespace: intel-igpu
  interval: 1h
  dependsOn:
    - name: intel-device-plugins-operator
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.1
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: flux-system
  values:
    sharedDevNum: 1
    logLevel: 2
    enableMonitoring: true
    # rendered as preferredAllocationPolicy in the GpuDevicePlugin
    allocationPolicy: none
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
    # also installs the two NodeFeatureRules that label the GPU nodes
    nodeFeatureRule: true
