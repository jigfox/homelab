apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  releaseName: tofu-controller
  targetNamespace: flux-system
  interval: 1h
  chart:
    spec:
      chart: tofu-controller
      version: 0.16.6
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # the runner pods (OpenTofu) get their resources from the Terraform CR's
    # runnerPodTemplate, see infrastructure/configs/unifi/terraform.yaml
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
        cpu: null # unset the chart default CPU limit
