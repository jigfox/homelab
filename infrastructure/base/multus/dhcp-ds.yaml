apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: kube-system
  name: dhcp-b293a4ed
  labels:
    app: cni-dhcp-daemon
spec:
  selector:
    matchLabels:
      app: cni-dhcp-daemon
  template:
    metadata:
      labels:
        app: cni-dhcp-daemon
    spec:
      hostNetwork: true
      volumes:
        - name: cnibin
          hostPath:
            path: /opt/cni/bin
        - name: run-cni
          hostPath:
            path: /run/cni
        - name: netns
          hostPath:
            path: /var/run/netns
      containers:
        - name: cni-dhcp-daemon
          image: alpine:3.24.4
          # a killed daemon leaves its socket on the host and the next one
          # fails with "address already in use"; one daemon per node, so a
          # leftover socket is always stale
          command: ["sh", "-c", "rm -f /run/cni/dhcp.sock && exec /opt/cni/bin/dhcp daemon"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: run-cni
              mountPath: /run/cni
            - name: cnibin
              mountPath: /opt/cni/bin
            - name: netns
              mountPath: /var/run/netns
              mountPropagation: HostToContainer
