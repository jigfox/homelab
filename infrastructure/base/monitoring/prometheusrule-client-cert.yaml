apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: client-certificate-expiration
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: client-certificate-expiration
      rules:
        # Replaces the chart's KubeClientCertificateExpiration pair, whose 7d /
        # 24h thresholds are hardcoded in the template and so can only be
        # changed by disabling it (see defaultRules.disabled in release.yaml).
        #
        # The admin kubeconfig cert is the one that matters here: it is a
        # one-year cert on a laptop that nothing rotates automatically, and
        # losing it means losing cluster access. 7 days of warning is shorter
        # than a holiday.
        #
        # The apiserver histogram's buckets step 7d -> 30d -> 90d -> 180d, so
        # only a bucket boundary resolves exactly; anything between 30d and 90d
        # fires as soon as a cert drops under ~90d. Kubelets rotate their
        # one-year client certs at 70-90% of the lifetime, i.e. with 36-110d
        # left, so they pass through that bucket every year. 30d sits below
        # the latest kubelet rotation: whatever trips it is a cert nothing
        # rotates, in practice a kubeconfig.
        - alert: KubeClientCertificateExpiration
          annotations:
            description: A client certificate used to authenticate to kubernetes apiserver is expiring in less than 30 days on cluster {{ $labels.cluster }}. If this is the admin kubeconfig, renew it with `talosctl kubeconfig ./clusterconfig/kubeconfig --merge=false --force --nodes <control-plane>` from ./talos.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeclientcertificateexpiration
            summary: Client certificate is about to expire.
          expr: |-
            histogram_quantile(0.01, sum without (namespace, service, endpoint) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver"}[5m]))) < 2592000
            and
            on (job, cluster, instance) apiserver_client_certificate_expiration_seconds_count{job="apiserver"} > 0
          for: 1h
          labels:
            severity: warning
        - alert: KubeClientCertificateExpiration
          annotations:
            description: A client certificate used to authenticate to kubernetes apiserver is expiring in less than 7 days on cluster {{ $labels.cluster }}.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeclientcertificateexpiration
            summary: Client certificate is about to expire.
          expr: |-
            histogram_quantile(0.01, sum without (namespace, service, endpoint) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="apiserver"}[5m]))) < 604800
            and
            on (job, cluster, instance) apiserver_client_certificate_expiration_seconds_count{job="apiserver"} > 0
          for: 5m
          labels:
            severity: critical
