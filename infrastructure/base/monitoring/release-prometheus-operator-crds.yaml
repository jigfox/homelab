apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: monitoring
spec:
  releaseName: prometheus-operator-crds
  targetNamespace: monitoring
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: prometheus-operator-crds
      version: 32.0.2
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
