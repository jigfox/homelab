apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: litestream
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    - path: /metrics
      portNumber: 9090
    - port: restic-metrics
  selector:
    matchLabels:
      litestream: "true"
