# The VictoriaMetrics UIs have no authentication of their own; Authelia
# forward auth guards them (cluster-admin only). The chart's own routes are
# disabled in ./release.yaml because they would bypass it.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmui
  namespace: monitoring
spec:
  hostnames:
    - prometheus.${GATEWAY_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      namespace: gateway-default
      sectionName: https
  rules:
    # VictoriaMetrics serves an endpoint index at /; the UI lives under /vmui/
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            # with the scheme set the well-known port is left out of Location
            scheme: https
            path:
              type: ReplaceFullPath
              replaceFullPath: /vmui/
            statusCode: 302
    - backendRefs:
        - group: ""
          kind: Service
          name: vmsingle-vm
          port: 8428
          weight: 1
      # authelia decides per request (access_control: group cluster-admin);
      # unauthenticated requests get its redirect to the sso portal
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: sso
              port: 80
            http:
              # envoy appends the request path to this prefix
              path: /api/authz/ext-authz/
              # accept decides between authelia's 302 (browser) and 401
              allowedHeaders:
                - accept
                - authorization
                - cookie
                - proxy-authorization
                - x-forwarded-proto
      matches:
        - path:
            type: PathPrefix
            value: /
