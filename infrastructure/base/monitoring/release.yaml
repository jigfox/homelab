apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  releaseName: victoria-metrics-k8s-stack
  targetNamespace: monitoring
  interval: 1h
  # the monitoring.coreos.com CRDs (ServiceMonitor, PodMonitor, ...) are needed
  # by the cilium and cert-manager charts; the VM operator converts them
  dependsOn:
    - name: prometheus-operator-crds
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.97.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  values:
    # short names keep the service names stable: vm-grafana, vmsingle-vm, ...
    fullnameOverride: vm
    victoria-metrics-operator:
      crds:
        cleanup:
          # the pre-delete hook job carries a CPU limit and would wipe every VM
          # object on uninstall
          enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    vmsingle:
      spec:
        retentionPeriod: 30d
        storage:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
    vmagent:
      spec:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 64Mi
    vmalert:
      spec:
        extraArgs:
          external.url: https://vmalert.${GATEWAY_DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 64Mi
    alertmanager:
      enabled: true
      spec:
        externalURL: https://alerts.${GATEWAY_DOMAIN}
        storage:
          volumeClaimTemplate:
            metadata:
              name: alertmanager-pvc
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 56Mi
          limits:
            memory: 128Mi
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 64Mi
      config:
        global:
          smtp_smarthost: smtp.mailer.svc.cluster.local:25
          smtp_from: ${ALERT_EMAIL_FROM}
          smtp_require_tls: false
        route:
          group_by:
            - alertname
            - namespace
            - service
          group_wait: 30s
          repeat_interval: 30m
          receiver: owner
          # InfoInhibitor exists only to drive inhibition and is never meant to
          # notify; its built-in muting rule is not taking effect on
          # alertmanager 0.34, so route it to the null receiver explicitly.
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
        # the same inhibition rules kube-prometheus-stack shipped
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ "warning|info"
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
          - target_matchers:
              - alertname = InfoInhibitor
        receivers:
          - name: "null"
          - name: owner
            email_configs:
              - to: ${ALERT_EMAIL_TO}
                require_tls: false
                send_resolved: true
                headers:
                  # Alertmanager's default subject with 🚨:<count> instead of
                  # [FIRING:<count>] and ✅ instead of [RESOLVED]
                  Subject: >-
                    {{ if eq .Status "firing" }}🚨:{{ .Alerts.Firing | len }}{{ else }}✅{{ end }}
                    {{ .GroupLabels.SortedPairs.Values | join " " }}
                    {{ if gt (len .CommonLabels) (len .GroupLabels) }}({{ with .CommonLabels.Remove .GroupLabels.Names }}{{ .Values | join " " }}{{ end }}){{ end }}
    defaultRules:
      rules:
        # thresholds are hardcoded in the upstream rule; replaced by
        # infrastructure/configs/monitoring/vmrule-client-cert.yaml
        KubeClientCertificateExpiration:
          enabled: false
    # the sync-job downloads every dashboard into a ConfigMap at deploy time and
    # the Grafana sidecar loads them, so Grafana itself needs no persistence.
    # Bump revisions and tags here, Renovate opens PRs for them.
    defaultDashboards:
      sources:
        # superseded by the kube-prometheus set, which has the same views
        kubernetes-views-global:
          enabled: false
        kubernetes-views-namespaces:
          enabled: false
        kubernetes-views-pods:
          enabled: false
        kubernetes-views-nodes:
          enabled: false
        cert-manager:
          url: https://grafana.com/api/dashboards/22184/revisions/3/download
        restic-exporter:
          url: https://grafana.com/api/dashboards/17554/revisions/3/download
        litestream:
          url: https://raw.githubusercontent.com/benbjohnson/litestream/v0.5.17/grafana/litestream-dashboard.json
    syncJob:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
    grafana:
      enabled: true
      # the subchart ignores the parent's fullnameOverride and would name its
      # service after the release
      fullnameOverride: vm-grafana
      testFramework:
        # the test pod has no resources and is never run
        enabled: false
      # login only through Authelia (client `grafana` in apps/sso); members of
      # the LDAP group cluster-admin become Admin, everyone else is refused
      envFromSecret: grafana-oauth
      grafana.ini:
        server:
          root_url: https://grafana.${GATEWAY_DOMAIN}
        auth:
          disable_login_form: true
          oauth_auto_login: true
          signout_redirect_url: https://sso.${GATEWAY_DOMAIN}/logout
        auth.generic_oauth:
          enabled: true
          name: Authelia
          client_id: grafana
          # client_secret comes from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          scopes: openid profile email groups
          auth_url: https://sso.${GATEWAY_DOMAIN}/api/oidc/authorization
          token_url: https://sso.${GATEWAY_DOMAIN}/api/oidc/token
          api_url: https://sso.${GATEWAY_DOMAIN}/api/oidc/userinfo
          auth_style: InHeader
          use_pkce: true
          login_attribute_path: preferred_username
          name_attribute_path: name
          email_attribute_path: email
          groups_attribute_path: groups
          allowed_groups: cluster-admin
          role_attribute_path: contains(groups[*], 'cluster-admin') && 'Admin'
          role_attribute_strict: true
          allow_assign_grafana_admin: true
          allow_sign_up: true
      resources:
        requests:
          cpu: 30m
          memory: 272Mi
        limits:
          memory: 512Mi
      sidecar:
        dashboards:
          # the stack's default, /var/lib/grafana/dashboards, mounts an
          # emptyDir over the directory the download-dashboards init container
          # writes to and hides the Longhorn dashboard below
          folder: /var/lib/grafana/sidecar-dashboards
        resources:
          requests:
            cpu: 35m
            memory: 88Mi
          limits:
            memory: 128Mi
      # the sync-job names its ConfigMap after the dashboard title, and
      # "Longhorn Monitoring & Backups" is not a valid name, so Grafana's own
      # init container downloads this one at pod start instead
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-com
              orgId: 1
              folder: ""
              type: file
              disableDeletion: true
              options:
                path: /var/lib/grafana/dashboards/grafana-com
      dashboards:
        grafana-com:
          longhorn:
            gnetId: 16888
            revision: 14
            datasource:
              - name: DS_PROMETHEUS
                value: VictoriaMetrics
      downloadDashboards:
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
    kubelet:
      vmScrape:
        spec:
          # the chart copies every node label onto every kubelet/cAdvisor
          # series; with NFD on all nodes that is 48-99 labels, past vmsingle's
          # limit of 40, so whole series were rejected (too_many_labels). The
          # list replaces the chart's, so its three entries are repeated here.
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: (intel_)?feature_node_kubernetes_io_.+|extensions_talos_dev_.+|gpu_intel_com_.+
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet
    kubeEtcd:
      enabled: true
      endpoints:
        - ${ETCD_IP_1}
        - ${ETCD_IP_2}
        - ${ETCD_IP_3}
      service:
        # Talos serves etcd metrics as plain http on 2381
        port: 2381
        targetPort: 2381
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames: []
          endpoints:
            - port: http-metrics
              scheme: http
    kubeControllerManager:
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames: []
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                # the serving certificate does not cover the service name
                insecureSkipVerify: true
    kubeScheduler:
      vmScrape:
        spec:
          jobLabel: app.kubernetes.io/component
          namespaceSelector:
            matchNames: []
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: http-metrics
              scheme: https
              tlsConfig:
                insecureSkipVerify: true
    kubeProxy:
      # kube-proxy is replaced by Cilium
      enabled: false
    kube-state-metrics:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 88Mi
        limits:
          memory: 128Mi
    prometheus-node-exporter:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
