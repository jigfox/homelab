apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require resource requests and memory limits
    policies.kyverno.io/description: >-
      Every container needs CPU and memory requests and a memory limit. CPU
      limits are deliberately not required.
spec:
  # Kyverno 1.20 no longer runs legacy ClusterPolicies (and the chart refuses
  # to upgrade while one exists); this is the CEL version of the former one.
  validationActions:
    - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - longhorn-system
            - intel-igpu
  variables:
    - name: missing
      expression: >-
        (object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []))
        .filter(c, !(has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits))
        .map(c, c.name)
  validations:
    - expression: size(variables.missing) == 0
      messageExpression: >-
        'Every container and initContainer needs resources.requests.cpu,
        resources.requests.memory and resources.limits.memory; missing in: '
        + variables.missing.join(', ')
