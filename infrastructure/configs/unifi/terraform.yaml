# Plans every hour, applies only after a human approves (see CLAUDE.md,
# "UniFi as code"). State: Secret tfstate-default-unifi in flux-system.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: unifi
  namespace: flux-system
spec:
  interval: 1h
  # approvePlan is deliberately not set here: an approval committed to git is
  # itself a new revision, which makes the controller plan again under a new
  # plan id. Approve on the cluster object instead (see CLAUDE.md); unset, it
  # means manual approval.
  storeReadablePlan: human
  path: ./unifi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  varsFrom:
    - kind: Secret
      name: unifi-vars
  runnerPodTemplate:
    spec:
      # UNIFI_API, UNIFI_USERNAME, UNIFI_PASSWORD, UNIFI_INSECURE
      envFrom:
        - secretRef:
            name: unifi-credentials
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
