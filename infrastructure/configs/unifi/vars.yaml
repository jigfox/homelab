# key into a variable of that name and JSON-encodes the value, so a key `foo`
# with the value `{"a":1}` sets `variable "foo"` to the object, not a string.
# Edit with `sops`. `placeholder` is not declared by the module and only keeps
# the Secret non-empty (sops cannot encrypt an empty stringData).
