# Plans every hour, applies only after a human approves (see CLAUDE.md,
# "lldap as code"). State: Secret tfstate-default-lldap in flux-system.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: lldap
  namespace: flux-system
spec:
  interval: 1h
  # approvePlan is deliberately not set here: an approval committed to git is
  # itself a new revision, which makes the controller plan again under a new
  # plan id. Approve on the cluster object instead (see CLAUDE.md); unset, it
  # means manual approval.
  storeReadablePlan: human
  path: ./lldap
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  varsFrom:
    - kind: Secret
      name: lldap-vars
  runnerPodTemplate:
    metadata:
      # matched by the sso network policy, which admits only this runner
      labels:
        homelab/lldap-client: "true"
    spec:
      # LLDAP_HTTP_URL, LLDAP_LDAP_URL, LLDAP_PASSWORD
      envFrom:
        - secretRef:
            name: lldap-credentials
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
