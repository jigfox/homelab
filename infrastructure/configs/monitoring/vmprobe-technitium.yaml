  module: dns_tcp
  interval: 30s
  scrapeTimeout: 10s
  vmProberSpec:
    url: prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      targets:
        - ${DNS_A_IPV4}:53
        - '[${DNS_A_IPV6}]:53'
        - ${DNS_B_IPV4}:53
        - '[${DNS_B_IPV6}]:53'
      labels:
        transport: tcp
  metricRelabelConfigs:
    - source_labels: [instance]
      regex: '\[?(${DNS_A_IPV4}|${DNS_A_IPV6})\]?:53'
      target_label: server
      replacement: a
    - source_labels: [instance]
      regex: '\[?(${DNS_B_IPV4}|${DNS_B_IPV6})\]?:53'
      target_label: server
      replacement: b
    - source_labels: [instance]
      regex: '.*'
      target_label: family
      replacement: v4
    - source_labels: [instance]
      regex: '\[.*'
      target_label: family
      replacement: v6
