# Immich telemetry (IMMICH_TELEMETRY_INCLUDE=all): the API worker on 8081, the
# job workers on 8082. Scraped through the metrics-proxy sidecar on
# 9081/9082 while Immich listens on [::1] only (immich-app/immich#33173).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: immich
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - immich
  podMetricsEndpoints:
    - path: /metrics
      portNumber: 9081
    - path: /metrics
      portNumber: 9082
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
