apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: evcc
  namespace: monitoring
spec:
  groups:
    - name: evcc
      rules:
        # The wallbox (Pulsar Plus) is an OCPP client: it holds one websocket
        # to evcc through Gateway `cilium` (route /ocpp -> evcc:8887), so
        # Envoy has exactly one active upstream connection to that cluster
        # while it is connected. It reconnects every few minutes on its own,
        # hence the `for`; once it gave up for 6 hours until it was restarted,
        # while evcc kept showing stale values and could not run its plan.
        # `or vector(0)` also fires when the series vanish.
        - alert: WallboxOCPPDisconnected
          annotations:
            summary: The wallbox is not connected to evcc.
            description: No OCPP websocket from the wallbox to evcc for 15 minutes, so evcc can neither read nor control it. Check the wallbox app ("OCPP Verbinden"); restarting the wallbox brings it back.
          expr: |-
            (sum(envoy_cluster_upstream_cx_active{envoy_cluster_name="gateway-default/cilium-gateway-cilium/evcc_evcc_8887"}) or vector(0)) < 1
          for: 15m
          labels:
            severity: warning
