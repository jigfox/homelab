apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: backups
  namespace: monitoring
spec:
  groups:
    - name: backups
      rules:
        # the etcd CronJob runs daily at 02:20 (infrastructure/base/etcd-backup);
        # host "etcd" in the shared restic repository, read by restic-exporter
        - alert: EtcdBackupStale
          expr: time() - max(restic_backup_timestamp{client_hostname="etcd"}) > 36 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: No etcd snapshot in the restic repository for more than 36 hours.
            description: Check `kubectl -n etcd-backup get jobs` and the logs of the last etcd-backup job.
        - alert: EtcdBackupMissing
          expr: absent(restic_backup_timestamp{client_hostname="etcd"})
          for: 36h
          labels:
            severity: warning
          annotations:
            summary: The restic repository has no etcd snapshot at all.
        # the app sidecars back up hourly and restic-exporter refreshes every
        # 30 min, so a healthy host is at most ~2.5h old. etcd is daily
        # (above); knx-editor runs only while Home Assistant scales it up.
        - alert: ResticBackupStale
          expr: time() - max by (client_hostname) (restic_backup_timestamp{client_hostname!~"etcd|knx-editor"}) > 4 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No restic snapshot of {{ $labels.client_hostname }} for more than 4 hours.
            description: Check the logs of the restic sidecar (or CronJob) of that host.
        # A pod killed while it holds a lock leaves it behind. Backups still
        # succeed (shared lock), but every forget/check/prune needs the
        # repository exclusively and fails after --retry-lock, the etcd-backup
        # Job included. Real locks last minutes, prune on Sundays at most ~1h.
        - alert: ResticLockStale
          expr: restic_locks_total > 0
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: The shared restic repository has held a lock for more than 3 hours.
            description: >-
              The sidecars log "repository is already locked by PID ... on <pod>". If that pod
              is gone, remove the lock with `restic unlock` from any restic sidecar.
        # state 4 is Error (Longhorn's BackupState enum); the backup objects
        # come from the RecurringJobs in infrastructure/configs/longhorn
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Longhorn backup {{ $labels.backup }} of volume {{ $labels.volume }} failed.
            description: See the volume's backups in the Longhorn UI; the backup target is `backup-access-keys-wasabi`.
        - alert: LonghornBackupTargetUnavailable
          expr: max by (backup_target) (longhorn_backup_target_status{condition="unavailable"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Longhorn backup target {{ $labels.backup_target }} is unavailable.
