# Volume backups to the Wasabi backup target. Every volume without its own
# recurring-job labels is in the group "default", so new PVCs are covered
# without labelling them. This is the block-level layer under the restic and
# litestream backups and the only one for volumes without a sidecar
# (vmsingle, alertmanager, ollama).
#
# A backup job keeps its own snapshot per backup, so no extra snapshot
# cleanup job is needed; retain counts per job.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
  namespace: longhorn-system
spec:
  name: backup-daily
  task: backup
  # before the etcd backup (02:20), the descheduler (03:00) and the restic
  # checks (04:30)
  cron: "30 1 * * *"
  retain: 7
  concurrency: 2
  groups:
    - default
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-weekly
  namespace: longhorn-system
spec:
  name: backup-weekly
  task: backup
  cron: "30 0 * * 0"
  retain: 4
  concurrency: 2
  groups:
    - default
