apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: internal-ca
  subject:
    organizations:
      - Homelab
    organizationalUnits:
      - Infrastructure
  secretName: internal-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: internal-issuer
    kind: ClusterIssuer
    group: cert-manager.io
