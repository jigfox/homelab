name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every check is a step of hk.pkl, the same ones the git hooks run locally:
  # manifests built and schema-validated, repo invariants, secret scan over the
  # whole history, helm templating, linters and the renovate config. The tools
  # come from mise.toml, pinned.
  hk:
    name: hk check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      # only what hk's steps need: not krr, fnox, sops, the pipx tool or talos
      # (node for renovate_config is on the runner image; the enter hook of
      # mise.toml only runs in an activated shell, which this is not)
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: hk actionlint zizmor shellcheck gitleaks opentofu yq helm kubectl kubeconform
          experimental: true # mise.toml is a monorepo root
      - run: hk check --all --slow --profile ci
