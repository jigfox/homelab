monorepo_root = true

[monorepo]
config_roots = ["talos"]

[tools]
conform = "0.1.0-alpha.31"
flux2 = "2.9.6"
fnox = "1.39.0"
gitleaks = "8.30.1"
helm = "4.3.0"
jq = "1.8.2"
kubectl = "1.37.1"
lefthook = "2.2.2"
sops = "3.13.3"
yq = "4.54.1"

[env]
KUBECONFIG = { value = "{{config_root}}/talos/clusterconfig/kubeconfig" }

[hooks.enter]
shell = "fish"
script = '''
fnox activate fish | source
'''
