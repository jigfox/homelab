monorepo_root = true

[monorepo]
config_roots = ["talos"]

[tools]
conform = "0.1.0-alpha.31"
flux2 = "2.10.0"
fnox = "1.47.0"
gitleaks = "8.30.1"
helm = "4.3.1"
jq = "1.8.2"
kubectl = "1.37.2"
# 1.29.0 is the newest whose macOS binary starts: 1.30.0 and later crash in
# pyi_rth_pkgres (pkg_resources.NullProvider), and the repo is not pip-installable
"github:robusta-dev/krr" = "1.29.0"
lefthook = "2.2.2"
opentofu = "1.13.2" # same minor as the tf-runner image of tofu-controller
"pipx:qrcode" = "8.2" # `qr`: terminal QR codes for unifi:wg-profile --qr
sops = "3.13.3"
uv = "0.13.7" # runs the pipx: tool above
yq = "4.54.1"

[env]
KUBECONFIG = { value = "{{config_root}}/talos/clusterconfig/kubeconfig" }

[hooks.enter]
shell = "fish"
script = '''
fnox activate fish | source
# `git sdiff` / `git sshow` / `git slog` = diff / show / log -p with sops files
# decrypted (.gitattributes). Opt-in per call on purpose: a permanent textconv
# would also decrypt for gitleaks (git log -p) and every other tool. No
# cachetextconv either, it would keep the plaintext in .git.
set -l textconv (git rev-parse --show-toplevel)/.mise/lib/sops-textconv
git config --local --unset-all diff.sopsdiffer.textconv 2>/dev/null
for a in sdiff:diff sshow:show slog:'log -p'
    set -l kv (string split -m1 : $a)
    git config --local alias.$kv[1] "!git -c diff.sopsdiffer.textconv=$textconv $kv[2]"
end
# talos/clusterconfig/{talosconfig,kubeconfig}, only written when missing or expiring
mise run -q //talos:clientconfigs
'''
