apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: wg-easy
spec:
  replicas: 1
  strategy:
    type: Recreate
  serviceName: wg-easy
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      name: wg-easy
      labels:
        app.kubernetes.io/name: wg-easy
      annotations:
        k8s.v1.cni.cncf.io/networks: |
          [
            {
              "name": "macvlan-dhcp",
              "namespace":"kube-system",
              "mac": "${WG_MACVLAN_MAC}"
            }
          ]
    spec:
      # securityContext:
      #   sysctls:
      #     - name: net.ipv4.ip_forward
      #       value: "1"
      #     - name: net.ipv6.conf.all.forwarding
      #       value: "1"
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15
          env:
            - name: WG_INTERFACE
              value: net1
            - name: WG_MTU
              value: "1280"
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w net.ipv4.ip_forward=1
              sysctl -w net.ipv6.conf.all.forwarding=1
              ln -sf /usr/sbin/iptables-nft /usr/sbin/iptables
              ln -sf /usr/sbin/ip6tables-nft /usr/sbin/ip6tables
              ln -sf /usr/sbin/iptables-nft-restore /usr/sbin/iptables-restore
              ln -sf /usr/sbin/ip6tables-nft-restore /usr/sbin/ip6tables-restore
              NET1_GATEWAY="${DNS_2}"

              # Get the current IP of net1
              NET1_IP=$(ip -4 addr show net1 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')

              echo "Detected net1 IP: $NET1_IP"

              if [ -n "$NET1_IP" ]; then
                  # Add a rule: Traffic FROM this IP uses table 100
                  ip rule add from $NET1_IP lookup 100

                  # Add a route: Table 100 sends traffic to the gateway via net1
                  ip route add default via $NET1_GATEWAY dev net1 table 100

                  echo "Policy routing configured for net1."
              else
                  echo "ERROR: Could not detect IP on net1!"
              fi
              exec node server/index.mjs
          ports:
            - containerPort: 51820
              name: wg
              protocol: UDP
            - containerPort: 51821
              name: http
              protocol: TCP
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: config
              mountPath: /etc/wireguard
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: wg-easy-storage-claim
