apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mqtt
  namespace: smarthome
spec:
  dnsNames:
    - "mqtt.${GATEWAY_DOMAIN}"
  # RSA, so Tasmota can validate the chain against its built-in ISRG Root X1
  # (SetOption132 1) instead of pinning a fingerprint that breaks on renewal
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  secretName: mqtt-tls
