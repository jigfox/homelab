apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto
  namespace: smarthome
data:
  mosquitto.conf: |
    # no bind address: IPv4 and IPv6, the LoadBalancer is dual-stack
    listener 1883
    allow_anonymous false
    # built by the auth init container from the mosquitto-users Secret
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/auth/acl
    # TLS for the Tasmotas on the LAN; users and ACLs apply to both listeners
    listener 8883
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
  # Users come from the mosquitto-users Secret. A Tasmota device's username is
  # its MQTT topic (default FullTopic %prefix%/%topic%/), so %u limits it to
  # its own topics and it cannot switch the others.
  acl: |
    user homeassistant
    topic readwrite #

    # Tasmota: commands in, state and telemetry out (LWT included), plus the
    # group topic, the fallback topic (client id DVES_xxxxxx_fb) and discovery
    pattern read cmnd/%u/#
    pattern write stat/%u/#
    pattern write tele/%u/#
    pattern read cmnd/tasmotas/#
    pattern read cmnd/%c_fb/#
    pattern write tasmota/discovery/#
