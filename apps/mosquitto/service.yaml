# Home Assistant connects in-cluster (mosquitto.smarthome:1883), so plain
# MQTT stays off the LAN
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: smarthome
  labels:
    app: mosquitto
spec:
  type: ClusterIP
  ipFamilyPolicy: PreferDualStack
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      protocol: TCP
      port: 1883
      targetPort: 1883
---
# the Tasmotas connect over TLS to mqtt.${GATEWAY_DOMAIN}:8883
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-lan
  namespace: smarthome
  labels:
    app: mosquitto
    # selects the internal CiliumLoadBalancerIPPool this service draws from
    public: "false"
    # advertises the LB IP over BGP
    advertise: bgp
  annotations:
    external-dns.kubernetes.io/hostname: mqtt.${GATEWAY_DOMAIN}
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: PreferDualStack
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      protocol: TCP
      port: 8883
      targetPort: 8883
