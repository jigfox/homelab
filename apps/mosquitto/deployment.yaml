apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: smarthome
  labels:
    app: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        # the image's mosquitto user; reads the Secret and owns the auth files
        fsGroup: 1883
      initContainers:
        # hashes the plaintext users from the Secret into a password file and
        # copies the ACL next to it; mosquitto refuses world-readable auth files
        - name: auth
          image: eclipse-mosquitto:2.0.22
          command:
            - sh
            - -ec
            - |
              umask 077
              cp /secret/users /auth/passwd
              mosquitto_passwd -U /auth/passwd
              cp /config/acl /auth/acl
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: users
              mountPath: /secret
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: auth
              mountPath: /auth
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          resources:
            limits:
              memory: 112Mi
            requests:
              cpu: 10m
              memory: 112Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: auth
              mountPath: /mosquitto/auth
      volumes:
        - name: config
          configMap:
            name: mosquitto
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
              - key: acl
                path: acl
        - name: users
          secret:
            secretName: mosquitto-users
            defaultMode: 0440
        - name: auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
