apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: smarthome
  labels:
    app: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      # lets cert-reload signal mosquitto
      shareProcessNamespace: true
      securityContext:
        # the image's mosquitto user; reads the Secrets and owns the auth files
        fsGroup: 1883
      initContainers:
        # hashes the plaintext users from the Secret into a password file and
        # copies the ACL next to it; mosquitto refuses world-readable auth files.
        # cat, not cp: cp keeps the Secret's 0440 mode and mosquitto_passwd -U
        # then cannot rewrite the file
        - name: auth
          image: eclipse-mosquitto:2.0.22
          command:
            - sh
            - -ec
            - |
              umask 077
              cat /secret/users > /auth/passwd
              mosquitto_passwd -U /auth/passwd
              cat /config/acl > /auth/acl
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: users
              mountPath: /secret
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: auth
              mountPath: /auth
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          resources:
            limits:
              memory: 112Mi
            requests:
              cpu: 10m
              memory: 112Mi
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: auth
              mountPath: /mosquitto/auth
            - name: tls
              mountPath: /mosquitto/certs
              readOnly: true
        # mosquitto keeps the certificate it started with; when cert-manager
        # renews it (every ~60 days) this restarts the mosquitto container.
        # pkill without -x: busybox -x does not match the mosquitto process
        - name: cert-reload
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              old=$(md5sum /certs/tls.crt)
              while sleep 300; do
                new=$(md5sum /certs/tls.crt)
                if [ "$new" != "$old" ]; then
                  echo "certificate changed, restarting mosquitto"
                  pkill mosquitto
                  old=$new
                fi
              done
          securityContext:
            runAsUser: 1883
            runAsGroup: 1883
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              memory: 16Mi
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mosquitto
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
              - key: acl
                path: acl
        - name: users
          secret:
            secretName: mosquitto-users
            defaultMode: 0440
        - name: auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tls
          secret:
            secretName: mqtt-tls
            defaultMode: 0440
