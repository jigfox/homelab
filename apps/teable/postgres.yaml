# Postgres for Teable: two CNPG instances with streaming replication, each on
# its own single-replica Longhorn volume (longhorn-single). Plain upstream
# Postgres 17, no extensions.
#
# Recovery from the barman archive (the ObjectStore below): replace
# bootstrap.initdb with bootstrap.recovery (source teable-db-backup) and an
# externalClusters entry using the barman-cloud plugin with the same
# barmanObjectName, see the CNPG docs "Recovery" and the plugin's docs.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: teable-db
  namespace: teable
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11
  bootstrap:
    initdb:
      database: teable
      owner: teable
  storage:
    size: 5Gi
    storageClass: longhorn-single
  # the instances may run on any node, but never two on the same one
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: teable-db-backup
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: teable-db-backup
  namespace: teable
spec:
  # 30 days of base backups and WAL; the bucket keeps deleted objects another
  # 30 days (see "SQLite apps run a litestream sidecar" in CLAUDE.md)
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://backup.${GATEWAY_DOMAIN}/cnpg/teable
    endpointURL: https://s3.eu-central-2.wasabisys.com
    s3Credentials:
      accessKeyId:
        name: teable-secrets
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: teable-secrets
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    # boto3 sends CRC checksums by default, which S3-compatible stores do not
    # all accept
    env:
      # boto3 otherwise signs for us-east-1; the bucket is in eu-central-2
      - name: AWS_DEFAULT_REGION
        value: eu-central-2
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
---
# 02:50, after the Longhorn backups (01:30) and the etcd backup (02:20), before
# the descheduler (03:00); six fields, the first one is seconds
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: teable-db-daily
  namespace: teable
spec:
  schedule: "0 50 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  cluster:
    name: teable-db
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
