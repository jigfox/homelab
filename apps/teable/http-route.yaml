apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: teable
  namespace: teable
spec:
  hostnames:
    - teable.${GATEWAY_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      namespace: gateway-default
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: teable
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
