# Teable (Airtable-like database), Community Edition. One replica; the assets
# volume is RWO, hence Recreate. Image pinned by index digest: there are no
# release tags, only `latest`, so Renovate bumps the digest (reviewed, see
# renovate.json) and every bump may run database migrations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teable
  namespace: teable
  labels:
    app.kubernetes.io/name: teable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teable
    spec:
      containers:
        - name: teable
          image: ghcr.io/teableio/teable:latest@sha256:426830da78ba2200a954aaed80b8b89b548937788c62c70dd26d0657a8c08e40
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            # SECRET_KEY, BACKEND_STORAGE_ENCRYPTION_KEY/_IV and
            # BACKEND_OIDC_CLIENT_SECRET (the others in it are for barman)
            - secretRef:
                name: teable-secrets
          env:
            # the CNPG-generated Secret, so no database password is in git
            - name: PRISMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: teable-db-app
                  key: uri
            - name: PUBLIC_ORIGIN
              value: https://teable.${GATEWAY_DOMAIN}
            - name: BACKEND_CACHE_REDIS_URI
              value: redis://teable-valkey:6379/0
            # login is OIDC only (Authelia client teable, LDAP group teable);
            # the first user to log in becomes the instance admin
            - name: SOCIAL_AUTH_PROVIDERS
              value: oidc
            - name: PASSWORD_LOGIN_DISABLED
              value: "true"
            - name: BACKEND_OIDC_CLIENT_ID
              value: teable
            - name: BACKEND_OIDC_ISSUER
              value: https://sso.${GATEWAY_DOMAIN}
            - name: BACKEND_OIDC_AUTHORIZATION_URL
              value: https://sso.${GATEWAY_DOMAIN}/api/oidc/authorization
            - name: BACKEND_OIDC_TOKEN_URL
              value: https://sso.${GATEWAY_DOMAIN}/api/oidc/token
            - name: BACKEND_OIDC_USER_INFO_URL
              value: https://sso.${GATEWAY_DOMAIN}/api/oidc/userinfo
            - name: BACKEND_OIDC_CALLBACK_URL
              value: https://teable.${GATEWAY_DOMAIN}/api/auth/oidc/callback
            # Teable adds openid itself
            - name: BACKEND_OIDC_OTHER
              value: '{"scope":["email","profile"]}'
            # the in-cluster relay (apps/mailer)
            - name: BACKEND_MAIL_HOST
              value: smtp.mailer.svc.cluster.local
            - name: BACKEND_MAIL_PORT
              value: "25"
            - name: BACKEND_MAIL_SECURE
              value: "false"
            - name: BACKEND_MAIL_SENDER
              value: teable@${GATEWAY_DOMAIN}
            - name: TZ
              value: Europe/Berlin
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          # the image has no USER: it runs as root, but /app belongs to uid 1001
          # and the backend writes into it (dist/openapi.json), so root needs
          # DAC_OVERRIDE. Running as 1001 breaks the migration instead: pnpm
          # comes from corepack's cache under /root.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          volumeMounts:
            - name: assets
              mountPath: /app/.assets
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: teable-assets
