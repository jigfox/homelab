# Uploaded attachments (BACKEND_STORAGE_PROVIDER local). Longhorn, so the
# default recurring jobs back it up (backup-daily, backup-weekly).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teable-assets
  namespace: teable
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
