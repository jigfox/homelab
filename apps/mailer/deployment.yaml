apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: mailer
  labels:
    app: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      containers:
        - name: relay
          # built by jigfox/smtp-relay CI; Renovate bumps the digest
          image: ghcr.io/jigfox/smtp-relay:1.0.0@sha256:047fae1816f32f62fe0acbf2d8397aa354c7e1756d738b47061e365fa4295b90
          imagePullPolicy: Always
          env:
            - name: RELAY_HOST
              value: smtp.mail.me.com
            - name: RELAY_PORT
              value: "587"
            - name: RELAY_NAME
              value: smtp.${GATEWAY_DOMAIN}
            - name: RELAY_USER
              valueFrom:
                secretKeyRef:
                  name: relay-credentials
                  key: user
            - name: RELAY_PASS
              valueFrom:
                secretKeyRef:
                  name: relay-credentials
                  key: password
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 50m
              memory: 5Mi
          # pipes need a shell; postfix must greet with its 220 banner
          startupProbe:
            exec:
              command: ["sh", "-c", 'printf "QUIT\r\n" | nc -w 3 127.0.0.1 25 | grep -q "^220 .*ESMTP Postfix"']
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", 'printf "QUIT\r\n" | nc -w 3 127.0.0.1 25 | grep -q "^220 .*ESMTP Postfix"']
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            exec:
              command: ["sh", "-c", 'printf "QUIT\r\n" | nc -w 3 127.0.0.1 25 | grep -q "^220 .*ESMTP Postfix"']
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 3
