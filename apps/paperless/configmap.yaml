apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-litestream-config
  namespace: paperless
data:
  litestream.yml: |
    addr: :9090
    dbs:
      - path: /usr/src/paperless/data/db.sqlite3
        replica:
          type: s3
          bucket: backup.${GATEWAY_DOMAIN}
          path: paperless
          endpoint: https://s3.eu-central-2.wasabisys.com
  restic-ignore.txt: |
    /paperless/data/db.sqlite3*
    /paperless/data/.db.sqlite3-*
    /paperless/data/celerybeat-schedule.db*
    /paperless/data/index
    /paperless/data/log
    lost+found
