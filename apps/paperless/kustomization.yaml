apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./secrets.yaml
  - ./amount-extractor-secrets.yaml
  - ./configmap.yaml
  - ./statefulset.yaml
  - ./redis.yaml
  - ./tika.yaml
  - ./gotenberg.yaml
  - ./service.yaml
  - ./http-route.yaml
  - ./networkpolicy.yaml
  - ./amount-extractor.yaml
# no $ in the script: Flux postBuild substitution would eat it
configMapGenerator:
  - name: amount-extractor
    namespace: paperless
    files:
      - amount-extractor.py
