# Ingress allow-list: everything not listed here is dropped (egress is not
# restricted). The Gateway's Envoy has the identity "ingress"; kubelet probes
# from the host are always allowed; Multus (macvlan) traffic bypasses Cilium.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: doko
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # litestream metrics (VMPodScrape litestream)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
