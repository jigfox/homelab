apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doko
  namespace: doko
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: doko
  serviceName: doko
  template:
    metadata:
      name: doko
      labels:
        app.kubernetes.io/name: doko
        litestream: "true"
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: doko
        - name: litestream-config
          configMap:
            name: doko-litestream
      initContainers:
        - name: init-litestream
          image: litestream/litestream:0.5.17
          args:
            - restore
            - -if-db-not-exists
            - -if-replica-exists
            - /data/doko.db
          envFrom:
            - secretRef:
                name: doko-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: doko
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          image: jigfox/doko:latest
          env:
            # litestream needs WAL mode; the busy timeout covers its checkpoints
            - name: DB_DSN
              value: /data/doko.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        - name: litestream
          image: litestream/litestream:0.5.17
          args:
            - replicate
          envFrom:
            - secretRef:
                name: doko-secrets
          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 96Mi
