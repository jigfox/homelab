# Ingress allow-list: everything not listed here is dropped (egress is not
# restricted). The Gateway's Envoy has the identity "ingress"; kubelet probes
# from the host are always allowed; Multus (macvlan) traffic bypasses Cilium.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: homeassistant
spec:
  endpointSelector: {}
  ingress:
    # node-red and matter to Home Assistant and back
    - fromEndpoints:
        - {}
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
            - port: "1880"
              protocol: TCP
    # Home Assistant's /api/prometheus and litestream
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    # Homepage's Home Assistant widget
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
