apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: homeassistant
  name: homeassistant
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"macvlan-dhcp","namespace":"kube-system"}]'
        prometheus.io/scrape: "true"
      labels:
        app: homeassistant
        litestream: "true"
      name: homeassistant
    spec:
      containers:
        - image: homeassistant/home-assistant:2026.11.0
          name: homeassistant
          volumeMounts:
            - mountPath: /config
              name: volume
            - mountPath: /config/configuration.yaml
              name: config
              subPath: configuration.yaml
            - mountPath: /config/solar-dashboard.yaml
              name: config
              subPath: solar-dashboard.yaml
            - mountPath: /config/www/knx-sidebar.js
              name: config
              subPath: knx-sidebar.js
          resources:
            requests:
              cpu: 50m
              memory: 896Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - args:
            - replicate
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: LITESTREAM_ACCESS_KEY_ID
                  name: homeassistant-secrets
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: LITESTREAM_SECRET_ACCESS_KEY
                  name: homeassistant-secrets
          image: litestream/litestream:0.5.18
          name: litestream
          ports:
            - containerPort: 9090
              name: metrics
              protocol: TCP
          volumeMounts:
            - mountPath: /config
              name: volume
            - mountPath: /etc/litestream.yml
              name: config
              subPath: litestream.yml
          resources:
            requests:
              cpu: 70m
              memory: 384Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - env:
            - name: RESTIC_DATA_DIR
              value: /config
            - name: BACKUP_SOURCE
              value: /config
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-2.wasabisys.com/backup.${GATEWAY_DOMAIN}/restic
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: homeassistant-secrets
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: homeassistant-secrets
            # without it the image falls back to its public default password
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeassistant-secrets
                  key: RESTIC_PASSWORD
            - name: RESTIC_BACKUP_OPTIONS
              value: --retry-lock 30m --exclude-file /etc/restic-ignore.txt
            - name: RESTIC_INSTANT_BACKUP
              value: "0"
            - name: RESTIC_HOST
              value: homeassistant
            # the sidecars share one repository: backups start 8 minutes apart and
            # each checks it on its own weekday, so exclusive locks rarely collide
            - name: BACKUP_CRON
              value: 0 * * * *
            - name: CHECK_CRON
              value: 30 4 * * 1
            # all sidecars share one repository; forget needs it exclusively, so wait
            # for the other pods' backups instead of failing
            - name: RESTIC_FORGET_ARGS
              value: --retry-lock 10m --keep-hourly 24 --keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 3
          image: ghcr.io/jigfox/restic-sidecar:4.0.0@sha256:9cf7c575d25ff67d45b6ca8353b67e06e009773cea61937323c46b8651cc2ca7
          imagePullPolicy: Always
          name: restic
          volumeMounts:
            - mountPath: /config
              name: volume
            - mountPath: /data
              name: data
            - mountPath: /etc/restic-ignore.txt
              name: config
              subPath: restic-ignore.txt
          resources:
            requests:
              cpu: 10m
              memory: 352Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      initContainers:
        - env:
            - name: RESTIC_DATA_DIR
              value: /config
            - name: BACKUP_SOURCE
              value: /config
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-2.wasabisys.com/backup.${GATEWAY_DOMAIN}/restic
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: homeassistant-secrets
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: homeassistant-secrets
            # without it the image falls back to its public default password
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeassistant-secrets
                  key: RESTIC_PASSWORD
            - name: RESTIC_BACKUP_OPTIONS
              value: --retry-lock 30m --exclude-file /etc/restic-ignore.txt
            - name: RESTIC_RESTORE
              value: "1"
            - name: RESTIC_HOST
              value: homeassistant
            - name: RESTIC_RESTORE_OPTIONS
              value: --exclude-xattr security.selinux
          image: ghcr.io/jigfox/restic-sidecar:4.0.0@sha256:9cf7c575d25ff67d45b6ca8353b67e06e009773cea61937323c46b8651cc2ca7
          imagePullPolicy: Always
          name: restic-restore
          volumeMounts:
            - mountPath: /config
              name: volume
            - mountPath: /etc/restic-ignore.txt
              name: config
              subPath: restic-ignore.txt
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - command:
            - sh
            - /config/install-hacs.sh
          image: alpine:3.24.3
          imagePullPolicy: Always
          name: install-hacs
          volumeMounts:
            - mountPath: /config
              name: volume
            - mountPath: /config/install-hacs.sh
              name: config
              subPath: install-hacs.sh
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - args:
            - restore
            - -if-db-not-exists
            - -if-replica-exists
            - /config/home-assistant_v2.db
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: LITESTREAM_ACCESS_KEY_ID
                  name: homeassistant-secrets
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: LITESTREAM_SECRET_ACCESS_KEY
                  name: homeassistant-secrets
          image: litestream/litestream:0.5.18
          name: init-litestream
          volumeMounts:
            - mountPath: /config
              name: volume
            - mountPath: /etc/litestream.yml
              name: config
              subPath: litestream.yml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - configMap:
            name: homeassistant
          name: config
        - name: volume
          persistentVolumeClaim:
            claimName: homeassistant
        - emptyDir: {}
          name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
