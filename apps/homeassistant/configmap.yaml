apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant
  namespace: homeassistant
data:
  configuration.yaml: |
    homeassistant:
      # Names shown in the Energy dashboard's legends.
      customize:
        sensor.solaredge_i1_m1_ac_energy_imported:
          friendly_name: Grid import
        sensor.solaredge_i1_m1_ac_energy_exported:
          friendly_name: Grid export
    my:
    energy:
    history:
    recorder:
    mobile_app:
    prometheus:
      filter:
        include_domains:
          - light
          - cover
    knx:
      sensor:
        - name: garden_temperature
          state_address: 4/1/0
          type: temperature
        - name: garden_wind_speed
          state_address: 4/2/0
          type: wind_speed_ms
          sync_state: expire 2
        - name: kitchen_cover_position
          state_address: 2/5/0
          type: percent
        - name: living_left_cover_position
          type: percent
          state_address: 2/5/1
        - name: living_middle_cover_position
          type: percent
          state_address: 2/5/2
        - name: living_right_cover_position
          type: percent
          state_address: 2/5/3
        - name: office_cover_position
          state_address: 2/5/8
          type: percent
        - name: big_bath_cover_position
          state_address: 2/5/9
          type: percent
        - name: guest_cover_position
          state_address: 2/5/7
          type: percent
        - name: child_cover_position
          state_address: 2/5/6
          type: percent
        - name: small_bath_cover_position
          state_address: 2/5/12
          type: percent
        - name: sleeping_cover_position
          state_address: 2/5/11
          type: percent
        - name: dressing_cover_position
          state_address: 2/5/10
          type: percent
        - name: awning_position
          state_address: 2/5/4
          type: percent
        - name: dining_cover_position
          state_address: 2/5/5
          type: percent
        - name: toilet_illuminence
          state_address: 0/3/2
          type: illuminance
        - name: brightness_south
          state_address: 4/3/0
          type: illuminance
        - name: brightness_west
          state_address: 4/3/1
          type: illuminance
      switch:
        - name: patio_switch
          address: 1/0/5
          state_address: 1/1/5
        - name: kitchen_gray_switch
          address: 1/0/6
          state_address: 1/1/6
        - name: living_black_switch
          address: 1/0/1
          state_address: 1/1/1
        - name: child_gray_switch
          address: 1/0/8
          state_address: 1/1/8
      weather:
        - name: garden
          address_wind_speed: 4/2/0
          address_temperature: 4/1/0
      #     address_brightness_south: 4/3/0
      #     address_brightness_west: 4/3/1
      #     address_wind_alarm: 4/4/0
    automation: !include automations.yaml
    # Aus git verwaltete Automationen; automations.yaml bleibt UI-verwaltet.
    automation gitops: !include automations-gitops.yaml
    homekit: !include homekit.yaml
    lovelace:
      dashboards:
        solar-live:
          mode: yaml
          filename: solar-dashboard.yaml
          title: Solar
          icon: mdi:solar-power
          show_in_sidebar: true
    # The KNX panel has no sidebar entry of its own; this one just navigates
    # to it (a webpage dashboard would nest the whole UI in an iframe).
    panel_custom:
      - name: knx-sidebar
        url_path: knx-sidebar
        sidebar_title: KNX
        sidebar_icon: mdi:bus-electric
        module_url: /local/knx-sidebar.js
        require_admin: true
    input_boolean:
      addi_home:
        name: Addi Zuhause
      jens_home:
        name: Jens Zuhause
      empty_home:
        name: niemand zu hause
    # Der Zeitpunkt, den evcc_office_plan zuletzt als evcc-Plan gesetzt hat
    # (1970-01-01 = keiner).
    input_datetime:
      evcc_office_plan:
        name: evcc Fahrt-Plan
        has_date: true
        has_time: true
        icon: mdi:calendar-clock
      # Plan-Zeitpunkt, an den evcc_plan_unplugged zuletzt erinnert hat.
      evcc_plan_reminded:
        name: evcc Plan-Erinnerung
        has_date: true
        has_time: true
        icon: mdi:bell-ring
      # Plan-Zeitpunkt, fuer den evcc_plan_limit zuletzt gewarnt hat.
      evcc_plan_limit_reminded:
        name: evcc Limit-Warnung
        has_date: true
        has_time: true
        icon: mdi:battery-alert
    # Der Zustand wird aus dem Cluster gelesen (scale-Subresource), stimmt also auch nach einem HA-Neustart.
    command_line:
      - switch:
          name: KNX Editor
          unique_id: knx_editor
          icon: mdi:bus-electric
          command_on: >-
            curl -sf -X PATCH --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" -H 'Content-Type: application/merge-patch+json' -d '{"spec":{"replicas":1}}' https://kubernetes.default.svc/apis/apps/v1/namespaces/knx-editor/statefulsets/knx-editor/scale
          command_off: >-
            curl -sf -X PATCH --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" -H 'Content-Type: application/merge-patch+json' -d '{"spec":{"replicas":0}}' https://kubernetes.default.svc/apis/apps/v1/namespaces/knx-editor/statefulsets/knx-editor/scale
          command_state: >-
            curl -sf --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" https://kubernetes.default.svc/apis/apps/v1/namespaces/knx-editor/statefulsets/knx-editor/scale
          value_template: "{{ value_json.spec.replicas | int(0) > 0 }}"
          scan_interval: 30
    # Adresse -> Koordinaten (OpenStreetMap). Waze' eigene Adresssuche liefert
    # nur noch HTTP 400, Routen mit Koordinaten funktionieren.
    rest_command:
      geocode:
        url: "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q={{ query | urlencode }}"
        method: get
        headers:
          User-Agent: homeassistant-evcc-plan
        timeout: 10
    sensor:
      - platform: rest
        name: regenradar
        scan_interval: 300
        json_attributes:
          - raintext
          - rainin30min
          - rainin60min
          - rainin120min
        resource: https://morgenwirdes.de/api/v3/rain.php?lat={{ state_attr('zone.home', 'latitude') }}&long={{ state_attr('zone.home', 'longitude') }}
        value_template: "{{ value_json.raintext }}"
      # Energy counters for the Energy dashboard. The inverter's own AC
      # counter mixes PV with battery flows, and the battery's lifetime
      # counters (b1_energy_import/export) stopped counting.
      - platform: integration
        source: sensor.pv_power
        name: Solar
        unique_id: pv_energy
        unit_prefix: k
        round: 3
        method: left
        max_sub_interval:
          minutes: 1
      - platform: integration
        source: sensor.battery_charge_power
        name: Battery charge
        unique_id: battery_charge_energy
        unit_prefix: k
        round: 3
        method: left
        max_sub_interval:
          minutes: 1
      - platform: integration
        source: sensor.battery_discharge_power
        name: Battery discharge
        unique_id: battery_discharge_energy
        unit_prefix: k
        round: 3
        method: left
        max_sub_interval:
          minutes: 1
      # - platform: template
      #   sensors:
      #     rrraintext:
      #       friendly_name: "Regentext"
      #       value_template: "{{ state_attr('sensor.regenradar', 'raintext') }}"
      #     rrrainin30min:
      #       friendly_name: "Regenin30min"
      #       value_template: "{{ state_attr('sensor.regenradar', 'rainin30min') }}"
      #     rrrainin60min:
      #       friendly_name: "Regenin60min"
      #       value_template: "{{ state_attr('sensor.regenradar', 'rainin60min') }}"
      #     rrrainin120min:
      #       friendly_name: "Regenin120min"
      #       value_template: "{{ state_attr('sensor.regenradar', 'rainin120min') }}"
    template:
      # Ziel der naechsten Fahrt fuer evcc_office_plan: Waze nimmt die
      # Koordinaten aus latitude/longitude. Ein "lat,lon"-Text ginge nicht,
      # Templates machen daraus ein Tupel.
      - triggers:
          - trigger: event
            event_type: evcc_trip_destination
        sensor:
          - default_entity_id: sensor.evcc_trip_destination
            name: evcc Fahrt-Ziel
            state: "{{ trigger.event.data.label | default('') | truncate(250) }}"
            attributes:
              latitude: "{{ trigger.event.data.lat | float }}"
              longitude: "{{ trigger.event.data.lon | float }}"
      - sensor:
          - default_entity_id: sensor.rrraintext
            name: Regentext
            state: "{{ state_attr('sensor.regenradar', 'raintext') }}"
          - default_entity_id: sensor.rrrainin30min
            name: Regenin30min
            state: "{{ state_attr('sensor.regenradar', 'rainin30min') }}"
          - default_entity_id: sensor.rrrainin60min
            name: Regenin60min
            state: "{{ state_attr('sensor.regenradar', 'rainin60min') }}"
          - default_entity_id: sensor.rrrainin120min
            name: Regenin120min
            state: "{{ state_attr('sensor.regenradar', 'rainin120min') }}"
      # The hybrid inverter's DC power includes the battery (b1 positive =
      # charging), so PV is DC power plus battery charge power.
      - sensor:
          - default_entity_id: sensor.pv_power
            name: PV power
            unique_id: pv_power
            unit_of_measurement: W
            device_class: power
            state_class: measurement
            availability: "{{ has_value('sensor.solaredge_i1_dc_power') and has_value('sensor.solaredge_i1_b1_dc_power') }}"
            state: "{{ [0, states('sensor.solaredge_i1_dc_power') | float + states('sensor.solaredge_i1_b1_dc_power') | float] | max }}"
          - default_entity_id: sensor.battery_charge_power
            name: Battery charge power
            unique_id: battery_charge_power
            unit_of_measurement: W
            device_class: power
            state_class: measurement
            availability: "{{ has_value('sensor.solaredge_i1_b1_dc_power') }}"
            state: "{{ [0, states('sensor.solaredge_i1_b1_dc_power') | float] | max }}"
          - default_entity_id: sensor.battery_discharge_power
            name: Battery discharge power
            unique_id: battery_discharge_power
            unit_of_measurement: W
            device_class: power
            state_class: measurement
            availability: "{{ has_value('sensor.solaredge_i1_b1_dc_power') }}"
            state: "{{ [0, -(states('sensor.solaredge_i1_b1_dc_power') | float)] | max }}"
  # Ladeplan fuer Fahrten: der naechste Termin mit Adresse, die laut Waze mehr
  # als min_km entfernt ist (Titel egal), wird zum evcc-Plan. Ziel-SoC = Hin-
  # und Rueckweg (Verbrauch temperaturabhaengig) + Reserve, Stichtag = Beginn -
  # Fahrzeit - Marge (ganztaegig: 06:30). Plaene, die von Hand in evcc gesetzt
  # wurden (Zeit != Helper), bleiben unangetastet.
  automations-gitops.yaml: |
    - id: evcc_office_plan
      alias: evcc_office_plan
      mode: single
      max_exceeded: silent
      triggers:
        # stuendlich, um Waze-Abfragen zu sparen
        - trigger: time_pattern
          minutes: 5
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: binary_sensor.evcc_wallbox_connected
          to: "on"
          id: plugged
      variables:
        calendars: "{{ states.calendar | map(attribute='entity_id') | list }}"
        battery_kwh: 77
        reserve_pct: 20
        min_km: 15
        margin_min: 15
        # hoechstens so viele Termine pro Lauf bei Waze nachschlagen
        max_lookups: 10
      actions:
        # Ohne Kalender-Integration gibt es nichts zu tun.
        - condition: template
          value_template: "{{ calendars | length > 0 }}"
        - action: calendar.get_events
          target:
            entity_id: "{{ calendars }}"
          data:
            duration:
              days: 7
          response_variable: agenda
        - variables:
            # Kuenftige Termine mit Adresse, nach Beginn sortiert, ohne Dubletten
            # (derselbe Termin in mehreren geteilten Kalendern).
            candidates: >-
              {% set ns = namespace(items=[], seen=[]) %}
              {% set floor = (now() + timedelta(minutes=30)).timestamp() %}
              {% for cal in agenda.values() %}
                {% for e in cal.events %}
                  {% set loc = e.location | default('', true) | replace('\n', ', ') | trim %}
                  {% set s = e.start | string %}
                  {% set allday = s | length <= 10 %}
                  {% set begin = as_local(as_datetime(s ~ ' 06:30:00')) if allday else as_local(as_datetime(s)) %}
                  {% set key = s ~ '|' ~ loc %}
                  {% if loc != '' and begin.timestamp() > floor and key not in ns.seen %}
                    {% set ns.seen = ns.seen + [key] %}
                    {% set ns.items = ns.items + [{'start': s, 'allday': allday, 'location': loc, 'ts': begin.timestamp()}] %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {{ (ns.items | sort(attribute='ts'))[:max_lookups] }}
            chosen: {}
        # Der Reihe nach bei Waze nachschlagen, bis ein Termin weit genug weg ist
        # und sein Stichtag noch mehr als 30 min in der Zukunft liegt.
        - repeat:
            while:
              - condition: template
                value_template: "{{ not chosen and repeat.index <= candidates | length }}"
            sequence:
              - variables:
                  c: "{{ candidates[repeat.index - 1] }}"
                  route: {}
                  geo: {}
                  dest: ""
              # Apple-Adressen enthalten oft Teile, die OpenStreetMap nicht kennt
              # (Firmen- oder Gebaeudenamen). Der Reihe nach: alles, ohne den
              # ersten Teil, ohne den zweiten Teil, nur PLZ und Ort (fuer die
              # Entfernung genau genug).
              - variables:
                  queries: >-
                    {% set parts = c.location.split(',') | map('trim') | reject('eq', '') | list %}
                    {% set ns = namespace(q=[]) %}
                    {% for q in [parts, parts[1:], parts[:1] + parts[2:], parts[-2:]] %}
                      {% set text = q | join(', ') %}
                      {% if text != '' and text not in ns.q %}
                        {% set ns.q = ns.q + [text] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.q }}
              - repeat:
                  while:
                    - condition: template
                      value_template: "{{ dest == '' and repeat.index <= queries | length }}"
                  sequence:
                    # Nominatim erlaubt hoechstens eine Anfrage pro Sekunde.
                    - delay: 1
                    - variables:
                        geo: {}
                    - action: rest_command.geocode
                      continue_on_error: true
                      data:
                        query: "{{ queries[repeat.index - 1] }}"
                      response_variable: geo
                    - variables:
                        dest: >-
                          {% set hits = geo.get('content') if geo is mapping else none %}
                          {{ hits[0] if hits is sequence and hits is not string and hits | length > 0 else '' }}
              - if:
                  - condition: template
                    value_template: "{{ dest != '' }}"
                then:
                  - event: evcc_trip_destination
                    event_data:
                      lat: "{{ dest.lat }}"
                      lon: "{{ dest.lon }}"
                      label: "{{ c.location }}"
                  # bis der Trigger-Sensor die Koordinaten uebernommen hat
                  - wait_template: >-
                      {{ (state_attr('sensor.evcc_trip_destination', 'latitude') | float(0) - dest.lat | float) | abs < 0.000001
                         and (state_attr('sensor.evcc_trip_destination', 'longitude') | float(0) - dest.lon | float) | abs < 0.000001 }}
                    timeout: 5
                  - action: waze_travel_time.get_travel_times
                    continue_on_error: true
                    data:
                      origin: zone.home
                      destination: sensor.evcc_trip_destination
                      region: eu
                      units: metric
                    response_variable: route
              - variables:
                  chosen: >-
                    {% set routes = route.get('routes', []) if route is mapping else [] %}
                    {% set r = routes | sort(attribute='duration') | first if routes | length > 0 else none %}
                    {% if r and r.distance > min_km %}
                      {% if c.allday %}
                        {% set dl = as_local(as_datetime(c.start ~ ' 06:30:00')) %}
                      {% else %}
                        {% set dl = as_local(as_datetime(c.start)) - timedelta(minutes=r.duration + margin_min) %}
                        {# auf 5 min abrunden, damit schwankende Fahrzeiten den Plan nicht stuendlich neu setzen #}
                        {% set dl = dl - timedelta(minutes=dl.minute % 5, seconds=dl.second, microseconds=dl.microsecond) %}
                      {% endif %}
                      {% if dl > now() + timedelta(minutes=30) %}
                        {{ {'location': c.location, 'km': r.distance | round(1), 'min': r.duration | round(0),
                            'deadline': dl.strftime('%Y-%m-%d %H:%M:00')} }}
                      {% else %}
                        {{ {} }}
                      {% endif %}
                    {% else %}
                      {{ {} }}
                    {% endif %}
        - variables:
            deadline: "{{ chosen.deadline if chosen else '' }}"
            # kWh/km: 0,18 ab 15 °C, je Grad darunter +0,004 (0 °C: 0,24).
            consumption: >-
              {{ 0.18 + 0.004 * ([0, 15 - states('sensor.garden_temperature') | float(5)] | max) }}
            # Ladelimit im Auto (EU Data Act, nur lesbar). Es bleibt die
            # Sicherung, weil evcc den SoC zu spaet erfaehrt; mehr laedt das
            # Auto ohnehin nicht.
            car_limit: "{{ states('sensor.id_7_tourer_pro_bcam_charge_threshold') | int(80) }}"
            needed_soc: >-
              {% if chosen %}
                {% set pct = 2 * chosen.km * consumption / battery_kwh * 100 + reserve_pct %}
                {{ [((pct / 5) | round(0, 'ceil') * 5) | int, 100] | min }}
              {% else %}
                0
              {% endif %}
            soc: "{{ [needed_soc | int, car_limit | int] | min }}"
            helper_set: "{{ states('input_datetime.evcc_office_plan') not in ['unknown', 'unavailable'] and not states('input_datetime.evcc_office_plan').startswith('1970') }}"
            # Stimmt der aktuelle evcc-Fahrzeugplan (UTC-Zeitstempel) mit dem
            # Helper (lokal) ueberein, ist es unser Plan.
            plan_is_ours: >-
              {% set plan = states('sensor.evcc_wallbox_vehicle_plans_time') %}
              {% if not helper_set or plan in ['unknown', 'unavailable', 'none', ''] %}
                false
              {% else %}
                {{ (as_timestamp(plan) - as_local(as_datetime(states('input_datetime.evcc_office_plan'))).timestamp()) | abs < 60 }}
              {% endif %}
            # Ein kuenftiger evcc-Plan, den nicht wir gesetzt haben: von Hand,
            # nicht ueberschreiben.
            manual_plan: >-
              {% set plan = states('sensor.evcc_wallbox_vehicle_plans_time') %}
              {{ plan not in ['unknown', 'unavailable', 'none', '']
                 and as_timestamp(plan, 0) > now().timestamp()
                 and not plan_is_ours }}
            # Unser Plan steht schon, aber mit anderem Ziel-SoC (Temperatur,
            # geaenderte Adresse).
            soc_changed: "{{ plan_is_ours and states('sensor.evcc_wallbox_vehicle_plans_soc') | int(0) != soc | int }}"
            # Plan wird in diesem Lauf neu gesetzt (dann kommt auch die
            # Limit-Benachrichtigung von dort).
            will_set: "{{ deadline != '' and (deadline != states('input_datetime.evcc_office_plan') or soc_changed) and not manual_plan }}"
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ will_set }}"
              sequence:
                - action: evcc_intg.set_vehicle_plan
                  data:
                    vehicle: "db:31"
                    soc: "{{ soc | int }}"
                    startdate: "{{ deadline }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.evcc_office_plan
                  data:
                    datetime: "{{ deadline }}"
                # Mehr noetig als das Auto laedt: Limit in der VW-App anheben,
                # der naechste Lauf uebernimmt es dann in den Plan.
                - if:
                    - condition: template
                      value_template: "{{ needed_soc | int > car_limit | int }}"
                  then:
                    - action: notify.mobile_app_jens_iphone
                      continue_on_error: true
                      data:
                        title: "Ladelimit im Auto zu niedrig"
                        message: >-
                          Fahrt nach {{ chosen.location }} ({{ chosen.km | round(0) | int }} km)
                          braucht {{ needed_soc }} %, das Auto laedt nur bis {{ car_limit }} %.
                          Geplant sind {{ soc }} % bis {{ as_datetime(deadline).strftime('%d.%m. %H:%M') }}.
                          Fuer mehr das Ladelimit in der VW-App anheben.
            - conditions:
                - condition: template
                  value_template: "{{ deadline == '' and helper_set }}"
              sequence:
                # Nur loeschen, was wir selbst gesetzt haben.
                - if:
                    - condition: template
                      value_template: "{{ plan_is_ours }}"
                  then:
                    - action: evcc_intg.del_vehicle_plan
                      data:
                        vehicle: "db:31"
                # Helper auch leeren, wenn der Plan schon weg ist (abgelaufen).
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.evcc_office_plan
                  data:
                    datetime: "1970-01-01 00:00:00"
        # Beim Einstecken an ein zu niedriges Ladelimit im Auto erinnern, wenn
        # unser Plan unveraendert bleibt.
        - if:
            - condition: template
              value_template: >-
                {{ trigger.id == 'plugged' and not will_set and plan_is_ours
                   and deadline != '' and needed_soc | int > car_limit | int }}
          then:
            - action: notify.mobile_app_jens_iphone
              continue_on_error: true
              data:
                title: "Ladelimit im Auto zu niedrig"
                message: >-
                  Fahrt nach {{ chosen.location }} ({{ chosen.km | round(0) | int }} km)
                  braucht {{ needed_soc }} %, das Auto laedt nur bis {{ car_limit }} %.
                  Geplant sind {{ soc }} % bis {{ as_datetime(deadline).strftime('%d.%m. %H:%M') }}.
                  Fuer mehr das Ladelimit in der VW-App anheben.
    # Erinnerung, das Auto einzustecken, wenn ein evcc-Plan (egal woher) laden
    # muss: um 21:45, wenn der Plan in den naechsten 24 h faellig ist, und
    # tagsueber, sobald der spaeteste Ladebeginn naeher als 1 h ist. Solange das
    # Auto nicht steckt, rechnet evcc keinen Ladebeginn aus; der spaeteste wird
    # aus fehlender Energie und Ladeleistung geschaetzt.
    - id: evcc_plan_unplugged
      alias: evcc_plan_unplugged
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: time
          at: "21:45:00"
          id: bedtime
        - trigger: time_pattern
          minutes: "/15"
          id: soon
      variables:
        battery_kwh: 77
        charge_kw: 11
        plan_ts: "{{ as_timestamp(states('sensor.evcc_wallbox_effective_plan_time'), 0) }}"
        plan_soc: "{{ states('sensor.evcc_wallbox_effective_plan_soc') | int(0) }}"
        vehicle_soc: "{{ states('sensor.evcc_wallbox_vehicle_soc') | int(0) }}"
        # +15 % fuer Ladeverluste und das langsamere Ende
        charge_min: "{{ ((plan_soc - vehicle_soc) / 100 * battery_kwh / charge_kw * 60 * 1.15) | round(0, 'ceil') | int }}"
        latest_start: "{{ plan_ts - charge_min * 60 }}"
        reminded: "{{ as_timestamp(as_local(as_datetime(states('input_datetime.evcc_plan_reminded'))), 0) }}"
      conditions:
        - condition: state
          entity_id: binary_sensor.evcc_wallbox_connected
          state: "off"
        - condition: template
          value_template: "{{ plan_ts > now().timestamp() and plan_soc > vehicle_soc }}"
      actions:
        - choose:
            - conditions:
                - condition: trigger
                  id: bedtime
                - condition: template
                  value_template: "{{ plan_ts < now().timestamp() + 24 * 3600 }}"
              sequence:
                - action: notify.mobile_app_jens_iphone
                  continue_on_error: true
                  data:
                    title: "Auto einstecken"
                    message: >-
                      evcc soll bis {{ plan_ts | timestamp_custom('%a %H:%M') }} auf {{ plan_soc }} % laden
                      (jetzt {{ vehicle_soc }} %, etwa {{ (charge_min / 60) | round(1) }} h),
                      das Auto steckt aber nicht.
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.evcc_plan_reminded
                  data:
                    timestamp: "{{ plan_ts }}"
            - conditions:
                - condition: trigger
                  id: soon
                # nachts nicht wecken, dafuer gibt es die Erinnerung um 21:45
                - condition: time
                  after: "07:00:00"
                  before: "21:45:00"
                - condition: template
                  value_template: "{{ now().timestamp() >= latest_start - 3600 and (reminded - plan_ts) | abs > 60 }}"
              sequence:
                - action: notify.mobile_app_jens_iphone
                  continue_on_error: true
                  data:
                    title: "Auto einstecken"
                    message: >-
                      evcc muss spaetestens um {{ latest_start | timestamp_custom('%H:%M') }} anfangen zu laden
                      ({{ plan_soc }} % bis {{ plan_ts | timestamp_custom('%a %H:%M') }}, jetzt {{ vehicle_soc }} %),
                      das Auto steckt aber nicht.
                    data:
                      push:
                        interruption-level: time-sensitive
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.evcc_plan_reminded
                  data:
                    timestamp: "{{ plan_ts }}"
    # Von Hand gesetzte evcc-Plaene (Zeit != Helper von evcc_office_plan, der
    # warnt selbst): Warnung, wenn das Ladelimit im Auto unter dem Plan-SoC
    # liegt. Einmal pro Plan, beim Einstecken erneut.
    - id: evcc_plan_limit
      alias: evcc_plan_limit
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: state
          entity_id:
            - sensor.evcc_wallbox_effective_plan_time
            - sensor.evcc_wallbox_effective_plan_soc
            - sensor.id_7_tourer_pro_bcam_charge_threshold
        - trigger: state
          entity_id: binary_sensor.evcc_wallbox_connected
          to: "on"
          id: plugged
      variables:
        plan_ts: "{{ as_timestamp(states('sensor.evcc_wallbox_effective_plan_time'), 0) }}"
        plan_soc: "{{ states('sensor.evcc_wallbox_effective_plan_soc') | int(0) }}"
        car_limit: "{{ states('sensor.id_7_tourer_pro_bcam_charge_threshold') | int(80) }}"
        ours: "{{ (plan_ts - as_timestamp(as_local(as_datetime(states('input_datetime.evcc_office_plan'))), 0)) | abs < 60 }}"
        reminded: "{{ as_timestamp(as_local(as_datetime(states('input_datetime.evcc_plan_limit_reminded'))), 0) }}"
      conditions:
        - condition: template
          value_template: >-
            {{ plan_ts > now().timestamp() and not ours and plan_soc > car_limit
               and (trigger.id == 'plugged' or (reminded - plan_ts) | abs > 60) }}
      actions:
        - action: notify.mobile_app_jens_iphone
          continue_on_error: true
          data:
            title: "Ladelimit im Auto zu niedrig"
            message: >-
              Der evcc-Plan will bis {{ plan_ts | timestamp_custom('%a %H:%M') }} auf {{ plan_soc }} % laden,
              das Auto laedt nur bis {{ car_limit }} %. Ladelimit in der VW-App anheben
              oder den Plan anpassen.
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.evcc_plan_limit_reminded
          data:
            timestamp: "{{ plan_ts }}"
    # Freier Strom: Hausakku erreicht 90 % und die PV-Prognose fuer den Rest des
    # Tages (Forecast.Solar) reicht fuer Hausverbrauch bis Sonnenuntergang, den
    # Hausakku bis 100 % und mindestens min_car_kwh fuers Auto, das unter seinem
    # eigenen Ladelimit ist und nicht steckt. Hoechstens einmal am Tag.
    - id: evcc_free_energy
      alias: evcc_free_energy
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: numeric_state
          entity_id: sensor.evcc_battery_soc
          above: 89.9
      variables:
        # Grundlast des Hauses tagsueber, kW
        home_kw: 0.5
        min_car_kwh: 3
        car_battery_kwh: 77
        pv_left: "{{ states('sensor.energy_production_today_remaining') | float(0) }}"
        sunset: "{{ as_timestamp(state_attr('sun.sun', 'next_setting'), now().timestamp()) }}"
        sun_hours: "{{ [0, (sunset - now().timestamp()) / 3600] | max }}"
        home_need: "{{ home_kw * sun_hours }}"
        # Rest bis 100 %, +10 % Ladeverluste
        battery_need: >-
          {{ (100 - states('sensor.evcc_battery_soc') | float(100)) / 100
             * states('sensor.evcc_battery_capacity') | float(7.44) * 1.1 }}
        surplus: "{{ pv_left - home_need - battery_need }}"
        car_soc: "{{ states('sensor.evcc_wallbox_vehicle_soc') | int(0) }}"
        car_limit: "{{ states('sensor.id_7_tourer_pro_bcam_charge_threshold') | int(80) }}"
        car_room: "{{ [0, (car_limit - car_soc) / 100 * car_battery_kwh] | max }}"
      conditions:
        - condition: state
          entity_id: binary_sensor.evcc_wallbox_connected
          state: "off"
        - condition: template
          value_template: >-
            {{ car_soc < car_limit and surplus >= min_car_kwh
               and (this.attributes.last_triggered is none
                    or as_local(this.attributes.last_triggered).date() != now().date()) }}
      actions:
        - action: notify.mobile_app_jens_iphone
          continue_on_error: true
          data:
            title: "Freier Strom fuers Auto"
            message: >-
              Hausakku bei {{ states('sensor.evcc_battery_soc') }} %, bis Sonnenuntergang
              ({{ sunset | timestamp_custom('%H:%M') }}) bleiben laut Prognose etwa
              {{ surplus | round(1) }} kWh uebrig. Das ID.7 ist bei {{ car_soc }} %
              (Limit {{ car_limit }} %, Platz fuer {{ car_room | round(0) | int }} kWh).
              Jetzt einstecken.
    # Nachts alle anstehenden HACS-Updates (Karten, Integrationen; Plattform
    # "marketplace") installieren; HA selbst ist ueber das Image gepinnt und
    # bleibt aussen vor. Integrationen greifen erst nach einem Neustart, also
    # danach neu starten, ausser es waren nur Karten (Name enthaelt "card").
    - id: hacs_auto_update
      alias: hacs_auto_update
      mode: single
      triggers:
        - trigger: time
          at: "04:15:00"
      variables:
        pending: >-
          {{ integration_entities('marketplace') | select('match', 'update\.')
             | select('is_state', 'on') | list }}
      conditions:
        - condition: template
          value_template: "{{ pending | length > 0 }}"
      actions:
        - repeat:
            for_each: "{{ pending }}"
            sequence:
              - action: update.install
                continue_on_error: true
                target:
                  entity_id: "{{ repeat.item }}"
        - condition: template
          value_template: "{{ pending | reject('search', 'card') | list | length > 0 }}"
        - action: homeassistant.restart
  # Live view like the SolarEdge app. Production counts from the same
  # counter as the Energy dashboard's solar source.
  solar-dashboard.yaml: |
    views:
      - title: Home
        type: sections
        max_columns: 3
        sections:
          - type: grid
            cards:
              - type: heading
                heading: Jetzt
              - type: custom:power-flow-card-plus
                entities:
                  solar:
                    entity: sensor.evcc_pv_power
                    display_zero_state: true
                  grid:
                    entity: sensor.evcc_grid_power
                  battery:
                    entity: sensor.evcc_battery_power
                    state_of_charge: sensor.evcc_battery_soc
                  individual:
                    - entity: sensor.evcc_wallbox_charge_power
                      name: ID.7
                      icon: mdi:car
                      # auch ohne Ladeleistung anzeigen, mit Ladestand
                      display_zero: true
                      display_zero_state: true
                      secondary_info:
                        entity: sensor.evcc_wallbox_vehicle_soc
                        unit_of_measurement: "%"
                clickable_entities: true
                display_zero_lines:
                  mode: grey_out
                  transparency: 50
                use_new_flow_rate_model: true
                w_decimals: 0
                kw_decimals: 2
                watt_threshold: 1000
          - type: grid
            cards:
              - type: heading
                heading: Produzierte Energie
              - type: statistic
                entity: sensor.solaredge_i1_ac_energy
                name: Heute
                stat_type: change
                period:
                  calendar:
                    period: day
                grid_options:
                  columns: 6
              - type: statistic
                entity: sensor.solaredge_i1_ac_energy
                name: Diesen Monat
                stat_type: change
                period:
                  calendar:
                    period: month
                grid_options:
                  columns: 6
              - type: statistic
                entity: sensor.solaredge_i1_ac_energy
                name: Dieses Jahr
                stat_type: change
                period:
                  calendar:
                    period: year
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.solaredge_i1_ac_energy
                name: Lebensdauer
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.garden_temperature
                name: Außen
              - type: tile
                entity: sensor.solaredge_i1_b1_state_of_energy
                name: Batterie
          - type: grid
            cards:
              - type: heading
                heading: ID.7
              - type: tile
                entity: sensor.id_7_tourer_pro_battery
                name: Ladestand
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_effective_limit_soc
                name: Ladelimit
                grid_options:
                  columns: 6
              - type: tile
                entity: binary_sensor.evcc_wallbox_connected
                name: Angesteckt
                grid_options:
                  columns: 6
              - type: tile
                entity: binary_sensor.evcc_wallbox_charging
                name: Lädt
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_effective_plan_time
                name: Plan
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_effective_plan_soc
                name: Planziel
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_session_energy
                name: Ladevorgang
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_session_solar_percentage
                name: Solaranteil
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.id_7_tourer_pro_monthly_charged_energy
                name: Geladen diesen Monat
              - type: history-graph
                title: Ladestand
                hours_to_show: 48
                min_y_axis: 0
                max_y_axis: 100
                entities:
                  - entity: sensor.id_7_tourer_pro_battery
                    name: Ladestand
          - type: grid
            cards:
              - type: heading
                heading: Wallbox
              - type: custom:evcc-card
                loadpoint: wallbox
  knx-sidebar.js: |
    class KnxSidebar extends HTMLElement {
      connectedCallback() {
        history.replaceState(null, "", "/knx/entities");
        window.dispatchEvent(new CustomEvent("location-changed", { detail: { replace: true } }));
      }
    }
    customElements.define("knx-sidebar", KnxSidebar);
  install-hacs.sh: |
    #!/bin/sh
    apk add bash wget unzip
    if [ ! -e /config/.HA_VERSION ]; then
      version_created=1
      echo "2025.9.1" >/config/.HA_VERSION
    fi
    cd /config
    wget -O - https://get.hacs.xyz | bash -
    if [ "$version_created" -eq 1 ]; then
      rm /config/.HA_VERSION
    fi
  litestream.yml: |
    addr: :9090
    dbs:
      - path: /config/home-assistant_v2.db
        replica:
          type: s3
          bucket: backup.${GATEWAY_DOMAIN}
          path: litestream/homeassistant
          endpoint: https://s3.eu-central-2.wasabisys.com
  restic-ignore.txt: |
    backups
    home-assistant_v2.db
    home-assistant_v2.db-*
    home-assistant.log
    home-assistant.log.*
