apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant
  namespace: homeassistant
data:
  configuration.yaml: |
    my:
    energy:
    history:
    recorder:
    mobile_app:
    prometheus:
      filter:
        include_domains:
          - light
          - cover
    knx:
      sensor:
        - name: garden_temperature
          state_address: 4/1/0
          type: temperature
        - name: garden_wind_speed
          state_address: 4/2/0
          type: wind_speed_ms
          sync_state: expire 2
        - name: kitchen_cover_position
          state_address: 2/5/0
          type: percent
        - name: living_left_cover_position
          type: percent
          state_address: 2/5/1
        - name: living_middle_cover_position
          type: percent
          state_address: 2/5/2
        - name: living_right_cover_position
          type: percent
          state_address: 2/5/3
        - name: office_cover_position
          state_address: 2/5/8
          type: percent
        - name: big_bath_cover_position
          state_address: 2/5/9
          type: percent
        - name: guest_cover_position
          state_address: 2/5/7
          type: percent
        - name: child_cover_position
          state_address: 2/5/6
          type: percent
        - name: small_bath_cover_position
          state_address: 2/5/12
          type: percent
        - name: sleeping_cover_position
          state_address: 2/5/11
          type: percent
        - name: dressing_cover_position
          state_address: 2/5/10
          type: percent
        - name: awning_position
          state_address: 2/5/4
          type: percent
        - name: dining_cover_position
          state_address: 2/5/5
          type: percent
        - name: toilet_illuminence
          state_address: 0/3/2
          type: illuminance
        - name: brightness_south
          state_address: 4/3/0
          type: illuminance
        - name: brightness_west
          state_address: 4/3/1
          type: illuminance
      switch:
        - name: patio_switch
          address: 1/0/5
          state_address: 1/1/5
        - name: kitchen_gray_switch
          address: 1/0/6
          state_address: 1/1/6
        - name: living_black_switch
          address: 1/0/1
          state_address: 1/1/1
        - name: child_gray_switch
          address: 1/0/8
          state_address: 1/1/8
      weather:
        - name: garden
          address_wind_speed: 4/2/0
          address_temperature: 4/1/0
      #     address_brightness_south: 4/3/0
      #     address_brightness_west: 4/3/1
      #     address_wind_alarm: 4/4/0
    automation: !include automations.yaml
    # Aus git verwaltete Automationen; automations.yaml bleibt UI-verwaltet.
    automation gitops: !include automations-gitops.yaml
    homekit: !include homekit.yaml
    lovelace:
      dashboards:
        solar-live:
          mode: yaml
          filename: solar-dashboard.yaml
          title: Solar
          icon: mdi:solar-power
          show_in_sidebar: true
    # The KNX panel has no sidebar entry of its own; this one just navigates
    # to it (a webpage dashboard would nest the whole UI in an iframe).
    panel_custom:
      - name: knx-sidebar
        url_path: knx-sidebar
        sidebar_title: KNX
        sidebar_icon: mdi:bus-electric
        module_url: /local/knx-sidebar.js
        require_admin: true
    input_boolean:
      addi_home:
        name: Addi Zuhause
      jens_home:
        name: Jens Zuhause
      empty_home:
        name: niemand zu hause
    # Buero-Tage ohne Adresse im Termin: Puffer zwischen Ladeziel und
    # Terminbeginn (Fahrtzeit).
    input_number:
      evcc_office_buffer:
        name: evcc Buero-Puffer
        min: 0
        max: 240
        step: 15
        initial: 90
        unit_of_measurement: min
        icon: mdi:car-clock
    # Der Zeitpunkt, den evcc_office_plan zuletzt als evcc-Plan gesetzt hat
    # (1970-01-01 = keiner).
    input_datetime:
      evcc_office_plan:
        name: evcc Buero-Plan
        has_date: true
        has_time: true
        icon: mdi:calendar-clock
    sensor:
      - platform: rest
        name: regenradar
        scan_interval: 300
        json_attributes:
          - raintext
          - rainin30min
          - rainin60min
          - rainin120min
        resource: https://morgenwirdes.de/api/v3/rain.php?lat={{ state_attr('zone.home', 'latitude') }}&long={{ state_attr('zone.home', 'longitude') }}
        value_template: "{{ value_json.raintext }}"
      # Energy counters for the Energy dashboard. The inverter's own AC
      # counter mixes PV with battery flows, and the battery's lifetime
      # counters (b1_energy_import/export) stopped counting.
      - platform: integration
        source: sensor.pv_power
        name: pv_energy
        unique_id: pv_energy
        unit_prefix: k
        round: 3
        method: left
        max_sub_interval:
          minutes: 1
      - platform: integration
        source: sensor.battery_charge_power
        name: battery_charge_energy
        unique_id: battery_charge_energy
        unit_prefix: k
        round: 3
        method: left
        max_sub_interval:
          minutes: 1
      - platform: integration
        source: sensor.battery_discharge_power
        name: battery_discharge_energy
        unique_id: battery_discharge_energy
        unit_prefix: k
        round: 3
        method: left
        max_sub_interval:
          minutes: 1
      # - platform: template
      #   sensors:
      #     rrraintext:
      #       friendly_name: "Regentext"
      #       value_template: "{{ state_attr('sensor.regenradar', 'raintext') }}"
      #     rrrainin30min:
      #       friendly_name: "Regenin30min"
      #       value_template: "{{ state_attr('sensor.regenradar', 'rainin30min') }}"
      #     rrrainin60min:
      #       friendly_name: "Regenin60min"
      #       value_template: "{{ state_attr('sensor.regenradar', 'rainin60min') }}"
      #     rrrainin120min:
      #       friendly_name: "Regenin120min"
      #       value_template: "{{ state_attr('sensor.regenradar', 'rainin120min') }}"
    template:
      - sensor:
          - default_entity_id: sensor.rrraintext
            name: Regentext
            state: "{{ state_attr('sensor.regenradar', 'raintext') }}"
          - default_entity_id: sensor.rrrainin30min
            name: Regenin30min
            state: "{{ state_attr('sensor.regenradar', 'rainin30min') }}"
          - default_entity_id: sensor.rrrainin60min
            name: Regenin60min
            state: "{{ state_attr('sensor.regenradar', 'rainin60min') }}"
          - default_entity_id: sensor.rrrainin120min
            name: Regenin120min
            state: "{{ state_attr('sensor.regenradar', 'rainin120min') }}"
      # The hybrid inverter's DC power includes the battery (b1 positive =
      # charging), so PV is DC power plus battery charge power.
      - sensor:
          - default_entity_id: sensor.pv_power
            name: PV power
            unique_id: pv_power
            unit_of_measurement: W
            device_class: power
            state_class: measurement
            availability: "{{ has_value('sensor.solaredge_i1_dc_power') and has_value('sensor.solaredge_i1_b1_dc_power') }}"
            state: "{{ [0, states('sensor.solaredge_i1_dc_power') | float + states('sensor.solaredge_i1_b1_dc_power') | float] | max }}"
          - default_entity_id: sensor.battery_charge_power
            name: Battery charge power
            unique_id: battery_charge_power
            unit_of_measurement: W
            device_class: power
            state_class: measurement
            availability: "{{ has_value('sensor.solaredge_i1_b1_dc_power') }}"
            state: "{{ [0, states('sensor.solaredge_i1_b1_dc_power') | float] | max }}"
          - default_entity_id: sensor.battery_discharge_power
            name: Battery discharge power
            unique_id: battery_discharge_power
            unit_of_measurement: W
            device_class: power
            state_class: measurement
            availability: "{{ has_value('sensor.solaredge_i1_b1_dc_power') }}"
            state: "{{ [0, -(states('sensor.solaredge_i1_b1_dc_power') | float)] | max }}"
  # Ladeplan fuer Buero-Tage: Termine, deren Titel mit "Buero" beginnt, werden
  # zum evcc-Plan. Mit Adresse im Termin rechnet Waze Strecke und Fahrzeit:
  # Ziel-SoC = Hin- und Rueckweg (Verbrauch temperaturabhaengig) + Reserve,
  # Stichtag = Beginn - Fahrzeit - Marge. Ohne Adresse oder Route: 80 % bis
  # Beginn minus Puffer. Ganztaegig: Abfahrt 06:30. Plaene, die von Hand in evcc
  # gesetzt wurden (Zeit != Helper), bleiben unangetastet.
  automations-gitops.yaml: |
    - id: evcc_office_plan
      alias: evcc_office_plan
      mode: single
      max_exceeded: silent
      triggers:
        - trigger: time_pattern
          minutes: "/30"
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id: binary_sensor.evcc_wallbox_connected
          to: "on"
      variables:
        calendars: "{{ states.calendar | map(attribute='entity_id') | list }}"
        battery_kwh: 77
        reserve_pct: 20
        fallback_soc: 80
        margin_min: 15
      actions:
        # Ohne Kalender-Integration gibt es nichts zu tun.
        - condition: template
          value_template: "{{ calendars | length > 0 }}"
        - action: calendar.get_events
          target:
            entity_id: "{{ calendars }}"
          data:
            duration:
              days: 7
          response_variable: agenda
        - variables:
            # Fruehester Buero-Termin ueber alle Kalender, dessen Stichtag mit
            # dem festen Puffer noch mehr als 1 h in der Zukunft liegt; sonst {}.
            # fallback: Stichtag lokal "YYYY-MM-DD HH:MM:00".
            office: >-
              {% set ns = namespace(best=none, event=none) %}
              {% set floor = (now() + timedelta(hours=1)).timestamp() %}
              {% set buffer = states('input_number.evcc_office_buffer') | float(90) %}
              {% for cal in agenda.values() %}
                {% for e in cal.events %}
                  {% if (e.summary | default('', true) | lower | replace('ü', 'ue') | trim).startswith('buero') %}
                    {% set s = e.start | string %}
                    {% if s | length <= 10 %}
                      {% set dl = as_local(as_datetime(s ~ ' 06:30:00')) %}
                    {% else %}
                      {% set dl = as_local(as_datetime(s)) - timedelta(minutes=buffer) %}
                    {% endif %}
                    {% if dl.timestamp() > floor and (ns.best is none or dl.timestamp() < ns.best.timestamp()) %}
                      {% set ns.best = dl %}
                      {% set ns.event = e %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {% if ns.best is none %}
                {{ {} }}
              {% else %}
                {{ {'start': ns.event.start | string,
                    'allday': (ns.event.start | string | length) <= 10,
                    'location': ns.event.location | default('', true) | replace('\n', ', ') | trim,
                    'fallback': ns.best.strftime('%Y-%m-%d %H:%M:00')} }}
              {% endif %}
        - if:
            - condition: template
              value_template: "{{ office.get('location', '') != '' }}"
          then:
            - action: waze_travel_time.get_travel_times
              continue_on_error: true
              data:
                origin: zone.home
                destination: "{{ office.location }}"
                region: eu
                units: metric
              response_variable: route
        - variables:
            # Schnellste Route (Minuten, km) oder none.
            best_route: >-
              {% set routes = (route | default({})).get('routes', []) if office.get('location', '') != '' else [] %}
              {{ routes | sort(attribute='duration') | first if routes | length > 0 else none }}
            # kWh/km: 0,18 ab 15 °C, je Grad darunter +0,004 (0 °C: 0,24).
            consumption: >-
              {{ 0.18 + 0.004 * ([0, 15 - states('sensor.garden_temperature') | float(5)] | max) }}
            soc: >-
              {% if best_route %}
                {% set pct = 2 * best_route.distance * consumption / battery_kwh * 100 + reserve_pct %}
                {{ [((pct / 5) | round(0, 'ceil') * 5) | int, 100] | min }}
              {% else %}
                {{ fallback_soc }}
              {% endif %}
            deadline: >-
              {% if not office %}
              {% elif best_route and not office.allday %}
                {% set dl = as_local(as_datetime(office.start)) - timedelta(minutes=best_route.duration + margin_min) %}
                {{ dl.strftime('%Y-%m-%d %H:%M:00') if dl > now() + timedelta(minutes=30) else office.fallback }}
              {% else %}
                {{ office.fallback }}
              {% endif %}
            helper_set: "{{ states('input_datetime.evcc_office_plan') not in ['unknown', 'unavailable'] and not states('input_datetime.evcc_office_plan').startswith('1970') }}"
            # Stimmt der aktuelle evcc-Fahrzeugplan (UTC-Zeitstempel) mit dem
            # Helper (lokal) ueberein, ist es unser Plan.
            plan_is_ours: >-
              {% set plan = states('sensor.evcc_wallbox_vehicle_plans_time') %}
              {% if not helper_set or plan in ['unknown', 'unavailable', 'none', ''] %}
                false
              {% else %}
                {{ (as_timestamp(plan) - as_local(as_datetime(states('input_datetime.evcc_office_plan'))).timestamp()) | abs < 60 }}
              {% endif %}
            # Ein kuenftiger evcc-Plan, den nicht wir gesetzt haben: von Hand,
            # nicht ueberschreiben.
            manual_plan: >-
              {% set plan = states('sensor.evcc_wallbox_vehicle_plans_time') %}
              {{ plan not in ['unknown', 'unavailable', 'none', '']
                 and as_timestamp(plan, 0) > now().timestamp()
                 and not plan_is_ours }}
            # Unser Plan steht schon, aber mit anderem Ziel-SoC (Temperatur,
            # geaenderte Adresse).
            soc_changed: "{{ plan_is_ours and states('sensor.evcc_wallbox_vehicle_plans_soc') | int(0) != soc | int }}"
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ deadline != '' and (deadline != states('input_datetime.evcc_office_plan') or soc_changed) and not manual_plan }}"
              sequence:
                - action: evcc_intg.set_vehicle_plan
                  data:
                    vehicle: "db:31"
                    soc: "{{ soc | int }}"
                    startdate: "{{ deadline }}"
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.evcc_office_plan
                  data:
                    datetime: "{{ deadline }}"
            - conditions:
                - condition: template
                  value_template: "{{ deadline == '' and helper_set }}"
              sequence:
                # Nur loeschen, was wir selbst gesetzt haben.
                - if:
                    - condition: template
                      value_template: "{{ plan_is_ours }}"
                  then:
                    - action: evcc_intg.del_vehicle_plan
                      data:
                        vehicle: "db:31"
                # Helper auch leeren, wenn der Plan schon weg ist (abgelaufen).
                - action: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.evcc_office_plan
                  data:
                    datetime: "1970-01-01 00:00:00"
  # Live view like the SolarEdge app. Production counts from the same
  # counter as the Energy dashboard's solar source.
  solar-dashboard.yaml: |
    views:
      - title: Home
        type: sections
        max_columns: 3
        sections:
          - type: grid
            cards:
              - type: heading
                heading: Jetzt
              - type: custom:power-flow-card-plus
                entities:
                  solar:
                    entity: sensor.evcc_pv_power
                    display_zero_state: true
                  grid:
                    entity: sensor.evcc_grid_power
                  battery:
                    entity: sensor.evcc_battery_power
                    state_of_charge: sensor.evcc_battery_soc
                  individual:
                    - entity: sensor.evcc_wallbox_charge_power
                      name: ID.7
                      icon: mdi:car
                clickable_entities: true
                display_zero_lines:
                  mode: grey_out
                  transparency: 50
                use_new_flow_rate_model: true
                w_decimals: 0
                kw_decimals: 2
                watt_threshold: 1000
          - type: grid
            cards:
              - type: heading
                heading: Produzierte Energie
              - type: statistic
                entity: sensor.solaredge_i1_ac_energy
                name: Heute
                stat_type: change
                period:
                  calendar:
                    period: day
                grid_options:
                  columns: 6
              - type: statistic
                entity: sensor.solaredge_i1_ac_energy
                name: Diesen Monat
                stat_type: change
                period:
                  calendar:
                    period: month
                grid_options:
                  columns: 6
              - type: statistic
                entity: sensor.solaredge_i1_ac_energy
                name: Dieses Jahr
                stat_type: change
                period:
                  calendar:
                    period: year
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.solaredge_i1_ac_energy
                name: Lebensdauer
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.garden_temperature
                name: Außen
              - type: tile
                entity: sensor.solaredge_i1_b1_state_of_energy
                name: Batterie
          - type: grid
            cards:
              - type: heading
                heading: ID.7
              - type: tile
                entity: sensor.id_7_tourer_pro_battery
                name: Ladestand
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_effective_limit_soc
                name: Ladelimit
                grid_options:
                  columns: 6
              - type: tile
                entity: binary_sensor.evcc_wallbox_connected
                name: Angesteckt
                grid_options:
                  columns: 6
              - type: tile
                entity: binary_sensor.evcc_wallbox_charging
                name: Lädt
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_effective_plan_time
                name: Plan
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_effective_plan_soc
                name: Planziel
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_session_energy
                name: Ladevorgang
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.evcc_wallbox_session_solar_percentage
                name: Solaranteil
                grid_options:
                  columns: 6
              - type: tile
                entity: sensor.id_7_tourer_pro_monthly_charged_energy
                name: Geladen diesen Monat
              - type: history-graph
                title: Ladestand
                hours_to_show: 48
                min_y_axis: 0
                max_y_axis: 100
                entities:
                  - entity: sensor.id_7_tourer_pro_battery
                    name: Ladestand
          - type: grid
            cards:
              - type: heading
                heading: Wallbox
              - type: custom:evcc-card
                loadpoint: wallbox
  knx-sidebar.js: |
    class KnxSidebar extends HTMLElement {
      connectedCallback() {
        history.replaceState(null, "", "/knx/entities");
        window.dispatchEvent(new CustomEvent("location-changed", { detail: { replace: true } }));
      }
    }
    customElements.define("knx-sidebar", KnxSidebar);
  install-hacs.sh: |
    #!/bin/sh
    apk add bash wget unzip
    if [ ! -e /config/.HA_VERSION ]; then
      version_created=1
      echo "2025.9.1" >/config/.HA_VERSION
    fi
    cd /config
    wget -O - https://get.hacs.xyz | bash -
    if [ "$version_created" -eq 1 ]; then
      rm /config/.HA_VERSION
    fi
  litestream.yml: |
    addr: :9090
    dbs:
      - path: /config/home-assistant_v2.db
        replica:
          type: s3
          bucket: backup.${GATEWAY_DOMAIN}
          path: litestream/homeassistant
          endpoint: https://s3.eu-central-2.wasabisys.com
  restic-ignore.txt: |
    backups
    home-assistant_v2.db
    home-assistant_v2.db-*
    home-assistant.log
    home-assistant.log.*
