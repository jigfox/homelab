apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: node-red
  name: node-red
  namespace: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
      name: node-red
    spec:
      containers:
        - env:
            - name: HASS_URL
              value: http://homeassistant
          image: nodered/node-red:4.1.17-22
          name: node-red
          volumeMounts:
            - mountPath: /data
              name: data
          resources:
            requests:
              cpu: 10m
              memory: 136Mi
            limits:
              memory: 256Mi
        - env:
            - name: RESTIC_DATA_DIR
              value: /data
            - name: BACKUP_SOURCE
              value: /data
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-2.wasabisys.com/backup.${GATEWAY_DOMAIN}/restic
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: homeassistant-secrets
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: homeassistant-secrets
            - name: RESTIC_INSTANT_BACKUP
              value: "0"
            - name: RESTIC_HOST
              value: nodered
            - name: BACKUP_CRON
              value: 0 */1 * * *
            - name: RESTIC_FORGET_ARGS
              value: --keep-hourly 24 --keep-daily 7 --keep-weekly 4 --keep-monthly 4
            # the exporter runs a full `restic check` of the shared repo every cycle, ~200m CPU nonstop; check.sh runs weekly
            - name: NO_CHECK
              value: "1"
          image: hub.${GATEWAY_DOMAIN}/restic-sidecar
          imagePullPolicy: Always
          name: restic
          resources:
            requests:
              cpu: 50m
              memory: 264Mi
            limits:
              memory: 512Mi
      securityContext:
        fsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: node-red
