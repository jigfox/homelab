# One-off import of the Arq 5 "Pictures" backup into Immich (see
# scripts/run.py). DRY_RUN=1 walks the backup and the catalog and prints the
# plan without any Immich write; set it to "0" and push to run for real
# (the Kustomization has force: true, so the changed Job is recreated).
# A rerun is safe: what is already in Immich is skipped by SHA1.
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-import
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-import
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 604800 # keep the logs for a week
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-import
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [nas]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          # Tradeoff: the stock python image plus a pinned pip install at start
          # (cryptography, lz4, boto3; wheels only, about 100 MB, a few seconds)
          # instead of a custom image to build and host for a single run.
          image: python:3.13.18-slim
          command:
            - sh
            - -c
            - >-
              pip install --quiet --no-cache-dir --disable-pip-version-check --only-binary=:all:
              --target /site cryptography==50.0.2 lz4==4.4.5 boto3==1.43.123
              && exec python /scripts/run.py
          env:
            - name: PYTHONPATH
              value: /site
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TMPDIR
              value: /stage
            - name: STAGE_DIR
              value: /stage
            - name: IMMICH_URL
              value: http://immich-server.immich.svc:2283/api
            - name: WORKERS
              value: "2"
            - name: DRY_RUN
              value: "1"
          envFrom:
            - secretRef:
                name: immich-import
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: site
              mountPath: /site
            - name: stage
              mountPath: /stage
      volumes:
        - name: scripts
          configMap:
            name: immich-import-scripts
        - name: site
          emptyDir:
            sizeLimit: 1Gi
        # one file per worker at a time (plus the 280 MB catalog), removed after upload
        - name: stage
          emptyDir:
            sizeLimit: 4Gi
