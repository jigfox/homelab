# One-off: delete this directory, fluxcd/homelab/apps-immich-import.yaml and its
# line in fluxcd/homelab/kustomization.yaml once the import has finished. The
# namespace belongs to apps/immich.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets.yaml
  - ./pvc.yaml
  - ./job.yaml
configMapGenerator:
  - name: immich-import-scripts
    namespace: immich
    files:
      - scripts/arq5.py
      - scripts/sidecar.py
      - scripts/run.py
