apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # CPU inference tuned for the RK3588 (num_thread 4); node1 has the most headroom
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
        - name: ollama
          image: ollama/ollama:0.40.13
          # serve, then pull the embedding model paperless uses; pull only
          # fetches layers that changed, so restarts are cheap.
          # The q8_0 QAT build is 12x faster than the default bf16 tag, which
          # the RK3588 can't compute natively. embeddinggemma-paperless runs on
          # the four A76 cores only: the A55 cores as well slow it down
          command:
            - /bin/sh
            - -c
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull embeddinggemma:300m-qat-q8_0 || echo "pulling embeddinggemma failed" >&2
              printf 'FROM embeddinggemma:300m-qat-q8_0\nPARAMETER num_thread 4\n' > /tmp/Modelfile
              ollama create embeddinggemma-paperless -f /tmp/Modelfile || echo "creating embeddinggemma-paperless failed" >&2
              wait
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            # embeddinggemma's own limit; paperless chunks are 1024 tokens
            - name: OLLAMA_CONTEXT_LENGTH
              value: "2048"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: 30m
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /data
              name: ollama-data
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
