# Homepage's config files. Link targets are static (hostnames of the
# HTTPRoutes); widgets that need API tokens read them from the sops Secret
# `homepage-secrets` (env `HOMEPAGE_VAR_*`, `{{HOMEPAGE_VAR_*}}` in these files).
# Every widget target must allow the `homepage` namespace in its network policy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    headerStyle: clean
    theme: dark
    color: slate
    # the longhorn info widget reads its URL from here, not from widgets.yaml
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc
    # widget tiles in full-width rows of equal height, the link-only
    # groups side by side below them
    useEqualHeights: true
    layout:
      Home:
        style: row
        columns: 4
      Status:
        style: row
        columns: 4
      Smart home:
        icon: mdi-home-automation
      Apps:
        icon: mdi-apps
      Monitoring:
        icon: mdi-chart-line
      Access:
        icon: mdi-shield-account
  services.yaml: |
    - Home:
      - Home Assistant:
          href: https://homeassistant.${GATEWAY_DOMAIN}
          icon: mdi-home-assistant-#18BCF2
          namespace: homeassistant
          app: homeassistant
          podSelector: app=homeassistant
          widget:
            type: homeassistant
            url: http://homeassistant.homeassistant.svc
            key: "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}"
            custom:
              - state: sensor.pv_power
                label: PV
              - state: sensor.solaredge_i1_b1_state_of_energy
                label: Battery
              - state: sensor.garden_temperature
                label: Garden
              - template: "{{ states.person | selectattr('state', 'equalto', 'home') | list | length }}"
                label: People home
      - evcc:
          href: https://evcc.${GATEWAY_DOMAIN}
          icon: mdi-ev-station-#0FDE41
          namespace: evcc
          app: evcc
          podSelector: app=evcc
          widget:
            type: evcc
            url: http://evcc.evcc.svc
      - Immich:
          href: https://immich.${GATEWAY_DOMAIN}
          icon: immich
          namespace: immich
          app: immich-server
          podSelector: app.kubernetes.io/name=immich-server
          widget:
            type: immich
            url: http://immich-server.immich.svc:2283
            key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
            version: 2
      - Paperless:
          href: https://paperless.${GATEWAY_DOMAIN}
          icon: paperless-ngx
          namespace: paperless
          app: paperless
          podSelector: app=paperless
          widget:
            type: paperlessngx
            url: http://paperless.paperless.svc
            key: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"
    - Status:
      - Prometheus:
          href: https://prometheus.${GATEWAY_DOMAIN}
          icon: victoriametrics
          namespace: monitoring
          app: vmsingle
          podSelector: app.kubernetes.io/name=vmsingle
          widget:
            type: prometheusmetric
            url: http://vmsingle-vm.monitoring.svc:8428
            metrics:
              # Watchdog and InfoInhibitor (severity none) always fire
              - label: Alerts firing
                query: count(ALERTS{alertstate="firing",severity=~"warning|critical"}) or vector(0)
                format:
                  type: number
              - label: Oldest backup
                query: (time() - min(restic_backup_timestamp)) / 3600
                format:
                  type: number
                  suffix: h
                  options:
                    maximumFractionDigits: 1
              - label: etcd backup
                query: (time() - max(restic_backup_timestamp{client_hostname="etcd"})) / 3600
                format:
                  type: number
                  suffix: h
                  options:
                    maximumFractionDigits: 1
      - Longhorn:
          href: https://longhorn.${GATEWAY_DOMAIN}
          icon: longhorn
          namespace: longhorn-system
          app: longhorn-ui
          podSelector: app=longhorn-ui
          widget:
            type: prometheusmetric
            url: http://vmsingle-vm.monitoring.svc:8428
            metrics:
              # longhorn_volume_robustness has one series per state, 1 = current
              - label: Healthy volumes
                query: count(longhorn_volume_robustness{state="healthy"} == 1) or vector(0)
                format:
                  type: number
              - label: Degraded/faulted
                query: count(longhorn_volume_robustness{state=~"degraded|faulted"} == 1) or vector(0)
                format:
                  type: number
              - label: Storage used
                query: sum(longhorn_node_storage_usage_bytes) / sum(longhorn_node_storage_capacity_bytes) * 100
                format:
                  type: percent
                  options:
                    maximumFractionDigits: 1
      - Technitium:
          href: https://dns.${GATEWAY_DOMAIN}
          icon: mdi-dns
          namespace: dns
          app: technitium
          podSelector: app=technitium
          widget:
            type: technitium
            url: http://technitium-0.dns.svc:5380
            key: "{{HOMEPAGE_VAR_TECHNITIUM_KEY}}"
            range: LastDay
      - UniFi:
          href: https://unifi.${GATEWAY_DOMAIN}
          icon: unifi
          # UniFi OS API key of its own (Control Plane > Integrations)
          widget:
            type: unifi
            url: https://unifi.${GATEWAY_DOMAIN}
            key: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
    - Smart home:
      - Node-RED:
          href: https://node-red.${GATEWAY_DOMAIN}
          icon: mdi-sitemap
          namespace: homeassistant
          app: node-red
          podSelector: app=node-red
      - KNX editor:
          href: https://knx.${GATEWAY_DOMAIN}
          icon: mdi-home-automation
      - Scrypted:
          href: https://scrypted.${GATEWAY_DOMAIN}
          icon: mdi-cctv
          namespace: scrypted
          app: scrypted
          podSelector: app=scrypted
    - Apps:
      - Mealie:
          href: https://mealie.${GATEWAY_DOMAIN}
          icon: mealie
          namespace: mealie
          app: mealie
          podSelector: app=mealie
          widget:
            type: mealie
            url: http://mealie.mealie.svc
            key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"
            version: 2
      - Doko:
          href: https://doko.${GATEWAY_DOMAIN}
          icon: mdi-cards-playing-#000000
          namespace: doko
          app: doko
          podSelector: app.kubernetes.io/name=doko
    - Monitoring:
      - Grafana:
          href: https://grafana.${GATEWAY_DOMAIN}
          icon: grafana
          namespace: monitoring
          app: grafana
          podSelector: app.kubernetes.io/name=grafana
      - Alerts:
          href: https://alerts.${GATEWAY_DOMAIN}
          icon: alertmanager
          namespace: monitoring
          app: vmalertmanager
          podSelector: app.kubernetes.io/name=vmalertmanager
      - vmalert:
          href: https://vmalert.${GATEWAY_DOMAIN}
          icon: mdi-bell-alert
          namespace: monitoring
          app: vmalert
          podSelector: app.kubernetes.io/name=vmalert
      - KRR:
          href: https://krr.${GATEWAY_DOMAIN}
          icon: mdi-scale-balance
          namespace: krr
          app: krr
          podSelector: app=krr
    - Access:
      - Authelia:
          href: https://sso.${GATEWAY_DOMAIN}
          icon: authelia
          namespace: sso
          app: authelia
          podSelector: app.kubernetes.io/name=authelia
      - lldap:
          href: https://ldap.${GATEWAY_DOMAIN}
          icon: mdi-account-group
          namespace: sso
          app: ldap
          podSelector: app=ldap
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium
          hourCycle: h23
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
    - search:
        provider: duckduckgo
        target: _blank
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: |
    []
  docker.yaml: |
    {}
  # Duskfox (nightfox.nvim), as in the terminal and editor: Homepage's dark
  # theme takes every color from this ramp, --color-800 is the background
  custom.css: |
    :root, .theme-slate {
      --color-50: 234 232 255;
      --color-100: 224 222 244;
      --color-200: 205 203 224;
      --color-300: 154 150 184;
      --color-400: 129 124 156;
      --color-500: 110 106 134;
      --color-600: 99 87 125;
      --color-700: 67 60 89;
      --color-800: 35 33 54;
      --color-900: 25 23 38;
      --color-logo-start: 86 159 186;
      --color-logo-stop: 196 167 231;
    }
