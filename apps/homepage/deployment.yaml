# Homepage (gethomepage.dev): the start page. Its config is the ConfigMap
# `homepage` (apps/homepage/configmap.yaml), mounted file by file; a config
# change needs a pod restart (subPath mounts do not refresh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0
          ports:
            - name: http
              containerPort: 3000
          env:
            # Homepage refuses requests whose Host header is not listed
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.${GATEWAY_DOMAIN}
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              # host validation rejects the pod IP the kubelet sends
              httpHeaders:
                - name: Host
                  value: home.${GATEWAY_DOMAIN}
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              # host validation rejects the pod IP the kubelet sends
              httpHeaders:
                - name: Host
                  value: home.${GATEWAY_DOMAIN}
            initialDelaySeconds: 30
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: logs
              mountPath: /app/config/logs
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: homepage
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
