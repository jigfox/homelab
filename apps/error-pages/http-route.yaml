# Catch-all for hostnames no other HTTPRoute claims. Gateway API ranks exact
# hostnames above wildcards, so every app's own route still wins.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: error-pages
  namespace: error-pages
spec:
  hostnames:
    - "*.${GATEWAY_DOMAIN}"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      namespace: gateway-default
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: error-pages
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
