apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./http-route.yaml
# no $ in these files: Flux postBuild substitution would eat nginx variables
configMapGenerator:
  - name: error-pages
    namespace: error-pages
    files:
      - default.conf
      - 404.html
