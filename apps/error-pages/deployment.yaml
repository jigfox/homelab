apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-pages
  namespace: error-pages
  labels:
    app: error-pages
spec:
  replicas: 2
  selector:
    matchLabels:
      app: error-pages
  template:
    metadata:
      labels:
        app: error-pages
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine-slim
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: pages
              subPath: default.conf
            - mountPath: /usr/share/nginx/html/404.html
              name: pages
              subPath: 404.html
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
      volumes:
        - configMap:
            name: error-pages
          name: pages
      securityContext:
        seccompProfile:
          type: RuntimeDefault
