apiVersion: v1
kind: Service
metadata:
  name: opengym
  namespace: opengym
  labels:
    app: opengym
spec:
  selector:
    app: opengym
  # the web image's nginx listens on IPv4 only (listen without [::]), an
  # IPv6 endpoint would make Envoy fail every other request with a 503
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
