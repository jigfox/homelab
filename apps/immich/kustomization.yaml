apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: immich-config
    namespace: immich
    files:
      - immich.json
resources:
  - ./namespace.yaml
  - ./secrets.yaml
  - ./storage.yaml
  - ./configmap-restic.yaml
  - ./postgres.yaml
  - ./valkey.yaml
  - ./machine-learning.yaml
  - ./server.yaml
  - ./http-route.yaml
  - ./networkpolicy.yaml
