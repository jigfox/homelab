# API, web UI and the background workers. Settings come from the config file in
# the plain-text immich.json (ConfigMap immich-config: OAuth, QuickSync, ML URL);
# the initContainer config adds the OAuth client secret from the sops Secret
# and writes the result to an in-memory volume. With IMMICH_CONFIG_FILE set the
# settings pages of the web UI are read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-server
spec:
  replicas: 1
  # RWO library volume and a GPU slot: never two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      initContainers:
        # fills an empty library from the latest snapshot of RESTIC_HOST
        - name: restic-restore
          image: ghcr.io/jigfox/restic-sidecar:latest@sha256:fe96fe348902ae7a99e1d490db9da510a512db6903e03761f5db8a2db48709c0
          imagePullPolicy: Always
          env:
            - name: RESTIC_DATA_DIR
              value: /data
            - name: BACKUP_SOURCE
              value: /data
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-2.wasabisys.com/backup.${GATEWAY_DOMAIN}/restic
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: AWS_SECRET_ACCESS_KEY
            # without it the image falls back to its public default password
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: RESTIC_PASSWORD
            - name: RESTIC_BACKUP_OPTIONS
              value: --retry-lock 30m --exclude-file /etc/restic-ignore.txt
            - name: RESTIC_RESTORE
              value: "1"
            - name: RESTIC_HOST
              value: immich
          volumeMounts:
            - name: library
              mountPath: /data
            - name: restic-config
              mountPath: /etc/restic-ignore.txt
              subPath: restic-ignore.txt
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
        # renders the config: template from the ConfigMap plus the OAuth secret
        - name: config
          image: ghcr.io/immich-app/immich-server:v3.3.6
          command:
            - node
            - -e
            - |
              const fs = require("fs");
              const c = JSON.parse(fs.readFileSync("/template/immich.json", "utf8"));
              c.oauth.clientSecret = process.env.OAUTH_CLIENT_SECRET;
              fs.writeFileSync("/config/immich.json", JSON.stringify(c, null, 2));
          env:
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: OAUTH_CLIENT_SECRET
          volumeMounts:
            - name: template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.3.6
          env:
            - name: IMMICH_CONFIG_FILE
              value: /config/immich.json
            - name: IMMICH_TELEMETRY_INCLUDE
              value: all
            - name: DB_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: host
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: password
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: dbname
            - name: REDIS_HOSTNAME
              value: immich-valkey
          ports:
            - name: http
              containerPort: 2283
              protocol: TCP
            - name: metrics-api
              containerPort: 8081
              protocol: TCP
            - name: metrics-jobs
              containerPort: 8082
              protocol: TCP
          # the first start runs the database migrations
          startupProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              gpu.intel.com/i915: 1
            limits:
              memory: 6Gi
              gpu.intel.com/i915: 1
          # root with the default capabilities: QuickSync opens
          # /dev/dri/renderD128 (root:render 0660), see machine-learning.yaml
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: library
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
        - name: restic
          image: ghcr.io/jigfox/restic-sidecar:latest@sha256:fe96fe348902ae7a99e1d490db9da510a512db6903e03761f5db8a2db48709c0
          imagePullPolicy: Always
          env:
            - name: RESTIC_DATA_DIR
              value: /data
            - name: BACKUP_SOURCE
              value: /data
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-2.wasabisys.com/backup.${GATEWAY_DOMAIN}/restic
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: AWS_SECRET_ACCESS_KEY
            # without it the image falls back to its public default password
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: RESTIC_PASSWORD
            - name: RESTIC_BACKUP_OPTIONS
              value: --retry-lock 30m --exclude-file /etc/restic-ignore.txt
            - name: RESTIC_INSTANT_BACKUP
              value: "0"
            - name: RESTIC_HOST
              value: immich
            # the sidecars share one repository: backups start 8 minutes apart and
            # each checks it on its own weekday, so exclusive locks rarely collide
            # (all eight 8-minute slots were taken: this one sits at minute 4)
            - name: BACKUP_CRON
              value: 4 * * * *
            - name: CHECK_CRON
              value: 30 5 * * 3
            # all sidecars share one repository; forget needs it exclusively, so wait
            # for the other pods' backups instead of failing
            - name: RESTIC_FORGET_ARGS
              value: --retry-lock 10m --keep-hourly 24 --keep-daily 7 --keep-weekly 4 --keep-monthly 4 --keep-yearly 3
          volumeMounts:
            - name: library
              mountPath: /data
            - name: restic-config
              mountPath: /etc/restic-ignore.txt
              subPath: restic-ignore.txt
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
        - name: restic-config
          configMap:
            name: immich-restic-config
        - name: template
          configMap:
            name: immich-config
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - name: http
      protocol: TCP
      port: 2283
      targetPort: http
