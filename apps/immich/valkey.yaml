# Job queue and cache for the Immich server; nothing in it has to survive a
# restart, so no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  namespace: immich
  labels:
    app.kubernetes.io/name: immich-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-valkey
    spec:
      nodeSelector:
        kubernetes.io/hostname: nas
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3-alpine
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: immich
spec:
  selector:
    app.kubernetes.io/name: immich-valkey
  ports:
    - name: valkey
      protocol: TCP
      port: 6379
      targetPort: valkey
