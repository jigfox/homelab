apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium
  namespace: dns
spec:
  hostnames:
    - dns.${GATEWAY_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cilium
      namespace: gateway-default
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: technitium-0
          port: 5380
          weight: 1
      # authelia decides per request (access_control: group cluster-admin)
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: sso
              port: 80
            http:
              path: /api/authz/ext-authz/
              allowedHeaders:
                - accept
                - authorization
                - cookie
                - proxy-authorization
                - x-forwarded-proto
      matches:
        - path:
            type: PathPrefix
            value: /
