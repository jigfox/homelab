# Ingress allow-list: everything not listed here is dropped (egress is not
# restricted). The Gateway's Envoy has the identity "ingress"; kubelet probes
# from the host are always allowed; Multus (macvlan) traffic bypasses Cilium.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: sso
spec:
  endpointSelector: {}
  ingress:
    # authelia to lldap
    - fromEndpoints:
        - {}
    # authelia and the lldap UI via the Gateway
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
            - port: "17170"
              protocol: TCP
    # The Gateway's ExternalAuth calls come from Envoy's node, not with the
    # "ingress" identity: host when it runs next to authelia, remote-node
    # otherwise
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # litestream metrics (VMPodScrape litestream)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # the lldap operator calls the lldap HTTP API
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lldap-operator
      toPorts:
        - ports:
            - port: "17170"
              protocol: TCP
