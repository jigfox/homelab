# Ingress allow-list: everything not listed here is dropped (egress is not
# restricted). The Gateway's Envoy has the identity "ingress"; kubelet probes
# from the host are always allowed; Multus (macvlan) traffic bypasses Cilium.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ingress
  namespace: sso
spec:
  endpointSelector: {}
  ingress:
    # authelia to lldap
    - fromEndpoints:
        - {}
    # authelia (also the Gateway's ExternalAuth) and the lldap UI
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
            - port: "17170"
              protocol: TCP
    # litestream metrics (VMPodScrape litestream)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
