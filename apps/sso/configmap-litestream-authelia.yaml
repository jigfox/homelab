apiVersion: v1
kind: ConfigMap
metadata:
  name: litestream-authelia
  namespace: sso
data:
  litestream.yml: |
    addr: :9090
    dbs:
      - path: /config/db.sqlite3
        replica:
          type: s3
          bucket: backup.${GATEWAY_DOMAIN}
          path: authelia
          endpoint: https://s3.eu-central-2.wasabisys.com
