# lets HTTPRoutes in these namespaces use authelia as their ExternalAuth backend
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authelia-authz
  namespace: sso
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: goldilocks
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: longhorn-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
  to:
    - group: ""
      kind: Service
      name: authelia
