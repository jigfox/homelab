apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: sso
spec:
  releaseName: authelia
  targetNamespace: sso
  interval: 1h
  chart:
    spec:
      chart: authelia
      version: 0.11.22
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  # the OIDC signing key, the OIDC client secrets and the LDAP bind password
  # are in the sops Secret authelia-secrets (apps/sso/authelia-secrets.yaml),
  # mounted under /secrets/authelia-secrets and referenced by path below;
  # everything else, the client definitions included, is plain here
  values:
    pod:
      kind: StatefulSet
      replicas: 1
      labels:
        litestream: "true"
      extraVolumes:
        - name: litestream-config
          configMap:
            name: litestream-authelia
      initContainers:
        - name: init-litestream
          image: litestream/litestream:0.5.18
          args:
            - restore
            - -if-db-not-exists
            - -if-replica-exists
            - /config/db.sqlite3
          envFrom:
            - secretRef:
                name: sso-secrets
          volumeMounts:
            - name: authelia
              mountPath: /config
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      extraContainers:
        - name: litestream
          image: litestream/litestream:0.5.18
          args:
            - replicate
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 25m
              memory: 96Mi
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - secretRef:
                name: sso-secrets
          volumeMounts:
            - name: authelia
              mountPath: /config
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
    ingress:
      enabled: true
      gatewayAPI:
        enabled: true
        hostnamesOverride:
          - sso.${GATEWAY_DOMAIN}
        parentRefs:
          - namespace: gateway-default
            name: cilium
            sectionName: https
          # the internet-facing gateway (infrastructure/base/gateway/public.yaml)
          - namespace: gateway-default
            name: public
            sectionName: https
    persistence:
      enabled: true
    secret:
      additionalSecrets:
        authelia-secrets: {}
    configMap:
      webauthn:
        enable_passkey_login: true
      # sso is reachable from the internet (the public gateway): a username
      # is banned for 1h after 5 failed logins within 10m. Per user only: the
      # client address reaches Authelia only as X-Forwarded-For, which is not
      # verified on the way in, so an ip mode could be used to ban others.
      regulation:
        modes:
          - user
        max_retries: 5
        find_time: 10 minutes
        ban_time: 1 hour
      # checked when a password is set through the portal (reset or change),
      # not for passwords that already exist
      password_policy:
        zxcvbn:
          enabled: true
          min_score: 3
      definitions:
        user_attributes:
          # Immich's roleClaim: admin for the LDAP group cluster-admin, user
          # for everyone else (`groups` is the user's group list)
          immich_role:
            expression: '"cluster-admin" in groups ? "admin" : "user"'
      # forward auth via the gateway's ExternalAuth filter
      # (/api/authz/ext-authz/); OIDC clients use their own
      # authorization_policies below and are unaffected
      access_control:
        default_policy: deny
        rules:
          - domain:
              - alerts.${GATEWAY_DOMAIN}
              - krr.${GATEWAY_DOMAIN}
              - ldap.${GATEWAY_DOMAIN}
              - longhorn.${GATEWAY_DOMAIN}
              - node-red.${GATEWAY_DOMAIN}
              - prometheus.${GATEWAY_DOMAIN}
              - vmalert.${GATEWAY_DOMAIN}
            subject:
              - group:cluster-admin
            policy: two_factor
      identity_providers:
        oidc:
          enabled: true
          # One policy per client (named by the client's authorization_policy),
          # each deny by default: a user without one of the listed LDAP groups
          # cannot log in to that client at all. Admin tools share cluster-admin.
          authorization_policies:
            mealie:
              default_policy: deny
              rules:
                - subject:
                    - group:mealie
                    - group:mealie-admins
                  policy: two_factor
            paperless:
              default_policy: deny
              rules:
                - subject: group:paperless
                  policy: two_factor
            knx:
              default_policy: deny
              rules:
                - subject: group:knx
                  policy: two_factor
            immich:
              default_policy: deny
              rules:
                - subject: group:immich
                  policy: two_factor
            teable:
              default_policy: deny
              rules:
                - subject: group:teable
                  policy: two_factor
            cluster-admin:
              default_policy: deny
              rules:
                - subject: group:cluster-admin
                  policy: two_factor
          claims_policies:
            fullname:
              custom_claims:
                fullname:
                  attribute: fullname
            immich:
              custom_claims:
                immich_role:
                  attribute: immich_role
            # Technitium maps groups from the ID token; Authelia only puts
            # them into the userinfo response unless a policy says otherwise
            technitium:
              id_token:
                - groups
                - email
                - email_verified
                - preferred_username
                - name
          # a client gets the custom claim only by requesting this scope
          scopes:
            fullname:
              claims:
                - fullname
            immich:
              claims:
                - immich_role
          # the signing key is the only sensitive part of this block
          jwks:
            - algorithm: RS256
              key:
                path: /secrets/authelia-secrets/OIDC_JWKS_KEY
          # every client names its own authorization_policy above; the secrets are
          # the pbkdf2 hashes in the sops Secret authelia-secrets (mounted below)
          clients:
            - client_id: mealie
              client_secret:
                path: /secrets/authelia-secrets/OIDC_CLIENT_SECRET_MEALIE
              redirect_uris:
                - https://mealie.${GATEWAY_DOMAIN}/login
              public: false
              authorization_policy: mealie
              require_pkce: true
              consent_mode: implicit
              claims_policy: fullname
              pkce_challenge_method: S256
              scopes: [openid, email, profile, groups]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_basic
              client_name: Mealie Recipe Manager
            - client_id: paperless
              redirect_uris:
                - https://paperless.${GATEWAY_DOMAIN}/accounts/oidc/authelia/login/callback/
                # Paperless iOS app (Swift Paperless)
                - x-paperless://oidc-callback
              public: true
              authorization_policy: paperless
              require_pkce: true
              consent_mode: implicit
              claims_policy: fullname
              pkce_challenge_method: S256
              scopes: [openid, email, profile, groups]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: none
              client_name: Paperless
            - client_id: knx
              client_secret:
                path: /secrets/authelia-secrets/OIDC_CLIENT_SECRET_KNX
              redirect_uris:
                - https://knx.${GATEWAY_DOMAIN}/oauth2/callback
              public: false
              authorization_policy: knx
              require_pkce: true
              consent_mode: implicit
              claims_policy: fullname
              pkce_challenge_method: S256
              scopes: [openid, email, profile, groups]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_basic
              client_name: KNX Editor
            - client_id: grafana
              client_secret:
                path: /secrets/authelia-secrets/OIDC_CLIENT_SECRET_GRAFANA
              redirect_uris:
                - https://grafana.${GATEWAY_DOMAIN}/login/generic_oauth
              public: false
              authorization_policy: cluster-admin
              require_pkce: true
              consent_mode: implicit
              claims_policy: fullname
              pkce_challenge_method: S256
              scopes: [openid, email, profile, groups]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_basic
              client_name: Grafana
            - client_id: technitium
              client_secret:
                path: /secrets/authelia-secrets/OIDC_CLIENT_SECRET_TECHNITIUM
              redirect_uris:
                - https://dns.${GATEWAY_DOMAIN}/sso/callback
              public: false
              authorization_policy: cluster-admin
              require_pkce: true
              consent_mode: implicit
              claims_policy: technitium
              pkce_challenge_method: S256
              scopes: [openid, email, profile, groups]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_post
              client_name: Technitium DNS
            - client_id: immich
              client_secret:
                path: /secrets/authelia-secrets/OIDC_CLIENT_SECRET_IMMICH
              redirect_uris:
                - https://immich.${GATEWAY_DOMAIN}/auth/login
                - https://immich.${GATEWAY_DOMAIN}/user-settings
                # the mobile app's HTTPS redirect (Immich forwards it to app.immich:///oauth-callback);
                # a confidential client may not accept the custom scheme, see mobileRedirectUri in the Immich config
                - https://immich.${GATEWAY_DOMAIN}/api/oauth/mobile-redirect
              public: false
              authorization_policy: immich
              require_pkce: false
              consent_mode: implicit
              claims_policy: immich
              pkce_challenge_method: S256
              scopes: [openid, email, profile, immich]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_post
              client_name: Immich
            - client_id: teable
              client_secret:
                path: /secrets/authelia-secrets/OIDC_CLIENT_SECRET_TEABLE
              redirect_uris:
                - https://teable.${GATEWAY_DOMAIN}/api/auth/oidc/callback
              public: false
              authorization_policy: teable
              require_pkce: false
              consent_mode: implicit
              scopes: [openid, email, profile]
              response_types: [code]
              grant_types: [authorization_code]
              userinfo_signed_response_alg: none
              # passport-openidconnect posts the secret in the body
              token_endpoint_auth_method: client_secret_post
              client_name: Teable
      authentication_backend:
        file:
          enabled: false
        ldap:
          enabled: true
          # the preset supplies lldap's DNs, filters and password modify op
          implementation: lldap
          base_dn: ${LDAP_BASE_DN}
          user: uid=admin,ou=people,${LDAP_BASE_DN}
          password:
            path: /secrets/authelia-secrets/LDAP_PASSWORD
          address: ldap://ldap:389
          attributes:
            # the custom implementation has no defaults for these; without
            # them the profile scope carries no given_name/family_name
            given_name: givenName
            family_name: sn
            extra:
              fullname:
                name: fullname
                valuetype: string
                multi_valued: false
      notifier:
        smtp:
          enabled: true
          sender: Authelia <auth@${GATEWAY_DOMAIN}>
          # was smtpStack.getOutput("smtp_url"); now the literal in-cluster address
          address: smtp://smtp.mailer.svc.cluster.local:25
          startup_check_address: ${ALERT_EMAIL_FROM}
          disable_require_tls: true
          disable_starttls: true
          username: ""
          password:
            disabled: true
      session:
        cookies:
          # subdomain builds authelia_url as https://sso.${GATEWAY_DOMAIN} while
          # leaving the cookie domain at the apex. Authelia picks the cookie
          # config by exact host match on authelia_url, not by domain suffix, so
          # omitting this defaults it to https://${GATEWAY_DOMAIN} and every
          # request to sso.${GATEWAY_DOMAIN} fails issuer discovery.
          - domain: ${GATEWAY_DOMAIN}
            subdomain: sso
      storage:
        local:
          enabled: true
          path: /config/db.sqlite3
