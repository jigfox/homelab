apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: sso
spec:
  releaseName: authelia
  targetNamespace: sso
  interval: 1h
  chart:
    spec:
      chart: authelia
      version: 0.11.22
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  # the OIDC signing key, the OIDC client secrets and the LDAP bind password
  # live in a sops Secret; everything below is non-sensitive
  valuesFrom:
    - kind: Secret
      name: authelia-values
      valuesKey: values.yaml
  values:
    pod:
      kind: StatefulSet
      replicas: 1
      labels:
        litestream: "true"
      extraVolumes:
        - name: litestream-config
          configMap:
            name: litestream-authelia
      initContainers:
        - name: init-litestream
          image: litestream/litestream:0.5.17
          args:
            - restore
            - -if-db-not-exists
            - -if-replica-exists
            - /config/db.sqlite3
          envFrom:
            - secretRef:
                name: sso-secrets
          volumeMounts:
            - name: authelia
              mountPath: /config
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      extraContainers:
        - name: litestream
          image: litestream/litestream:0.5.17
          args:
            - replicate
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 25m
              memory: 96Mi
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - secretRef:
                name: sso-secrets
          volumeMounts:
            - name: authelia
              mountPath: /config
            - name: litestream-config
              mountPath: /etc/litestream.yml
              subPath: litestream.yml
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
    ingress:
      enabled: true
      gatewayAPI:
        enabled: true
        hostnamesOverride:
          - sso.${GATEWAY_DOMAIN}
        parentRefs:
          - namespace: gateway-default
            name: cilium
            sectionName: https
    persistence:
      enabled: true
    configMap:
      webauthn:
        enable_passkey_login: true
      # forward auth via the gateway's ExternalAuth filter
      # (/api/authz/ext-authz/); OIDC clients use their own
      # authorization_policy and are unaffected
      access_control:
        default_policy: deny
        rules:
          - domain:
              - goldilocks.${GATEWAY_DOMAIN}
              - authtest.${GATEWAY_DOMAIN}
            subject:
              - group:cluster-admin
            policy: two_factor
      identity_providers:
        oidc:
          enabled: true
          claims_policies:
            fullname:
              custom_claims:
                fullname:
                  attribute: fullname
          # a client gets the custom claim only by requesting this scope
          scopes:
            fullname:
              claims:
                - fullname
      authentication_backend:
        file:
          enabled: false
        ldap:
          enabled: true
          # the preset supplies lldap's DNs, filters and password modify op
          implementation: lldap
          base_dn: ${LDAP_BASE_DN}
          user: uid=admin,ou=people,${LDAP_BASE_DN}
          address: ldap://ldap:389
          attributes:
            # the custom implementation has no defaults for these; without
            # them the profile scope carries no given_name/family_name
            given_name: givenName
            family_name: sn
            extra:
              fullname:
                name: fullname
                valuetype: string
                multi_valued: false
      notifier:
        smtp:
          enabled: true
          sender: Authelia <auth@${GATEWAY_DOMAIN}>
          # was smtpStack.getOutput("smtp_url"); now the literal in-cluster address
          address: smtp://smtp.mailer.svc.cluster.local:25
          startup_check_address: ${ALERT_EMAIL_FROM}
          disable_require_tls: true
          disable_starttls: true
          username: ""
          password:
            disabled: true
      session:
        cookies:
          # subdomain builds authelia_url as https://sso.${GATEWAY_DOMAIN} while
          # leaving the cookie domain at the apex. Authelia picks the cookie
          # config by exact host match on authelia_url, not by domain suffix, so
          # omitting this defaults it to https://${GATEWAY_DOMAIN} and every
          # request to sso.${GATEWAY_DOMAIN} fails issuer discovery.
          - domain: ${GATEWAY_DOMAIN}
            subdomain: sso
      storage:
        local:
          enabled: true
          path: /config/db.sqlite3
