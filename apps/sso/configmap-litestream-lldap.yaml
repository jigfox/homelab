apiVersion: v1
kind: ConfigMap
metadata:
  name: litestream-lldap
  namespace: sso
data:
  litestream.yml: |
    addr: :9090
    dbs:
      - path: /data/users.db
        replica:
          type: s3
          bucket: backup.${GATEWAY_DOMAIN}
          path: lldap
          endpoint: https://s3.eu-central-2.wasabisys.com
